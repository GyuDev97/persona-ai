  <rect x="1260" y="220" width="385" height="108" class="card purple"/>
  <text x="1290" y="257" class="label">gw_assistant / mail_assi</text>
  <text x="1290" y="284" class="small">그룹웨어 메일 보조 실험</text>
  <text x="1290" y="306" class="tiny">inbox router, mail logic, frontend</text>

  <rect x="1260" y="360" width="385" height="108" class="card purple"/>
  <text x="1290" y="397" class="label">gw_assistant / eapproval_autofill</text>
  <text x="1290" y="424" class="small">전자결재 자동 입력 실험</text>
  <text x="1290" y="446" class="tiny">FastAPI route, frontend, Excel sample</text>

  <rect x="1260" y="500" width="385" height="115" class="card mint"/>
  <text x="1290" y="537" class="label">Naver Blog Writer</text>
  <text x="1290" y="564" class="small">naver_blog_writer.py</text>
  <text x="1290" y="586" class="tiny">Agent 02 초안을 네이버 글쓰기 화면에 입력</text>

  <rect x="1260" y="645" width="385" height="115" class="card mint"/>
  <text x="1290" y="682" class="label">브라우저 / 데스크톱 자동화</text>
  <text x="1290" y="709" class="small">pc_desktop_actions.py</text>
  <text x="1290" y="731" class="tiny">화면 열기, 검색, 로컬 페이지 이동</text>

  <text x="90" y="805" class="section">주요 데이터 도메인</text>
