  <rect x="390" y="220" width="430" height="430" rx="20" class="card green"/>
  <text x="430" y="266" class="label">apps/personal_life</text>
  <text x="430" y="296" class="small">GyuOS 개인 생활 AI OS 본체</text>

  <rect x="430" y="330" width="340" height="72" class="card"/>
  <text x="455" y="360" class="label">FastAPI 서버</text>
  <text x="455" y="384" class="small">main.py, app/__init__.py, routes.py</text>

  <rect x="430" y="425" width="340" height="72" class="card"/>
  <text x="455" y="455" class="label">서비스 레이어</text>
  <text x="455" y="479" class="small">briefing, money, agent, memory, routine</text>

  <rect x="430" y="520" width="340" height="82" class="card"/>
  <text x="455" y="550" class="label">데이터 저장소</text>
  <text x="455" y="574" class="small">SQLite personal_life.db 또는 MariaDB</text>
  <text x="455" y="594" class="tiny">생활, 머니, 에이전트, 개발 제안 테이블</text>

  <text x="915" y="190" class="section">에이전트 운영</text>
  <rect x="880" y="220" width="310" height="100" class="card yellow"/>
  <text x="910" y="257" class="label">작업 큐</text>
  <text x="910" y="284" class="small">agent_tasks</text>
  <text x="910" y="306" class="tiny">pending -> claimed -> completed/failed</text>

  <rect x="880" y="350" width="310" height="105" class="card yellow"/>
  <text x="910" y="387" class="label">PC Agent Runner</text>
  <text x="910" y="414" class="small">pc_agent_runner.py</text>
  <text x="910" y="436" class="tiny">큐 폴링, 예약 수집, task_type 분기</text>

