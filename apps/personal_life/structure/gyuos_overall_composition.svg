  <rect class="bg" width="1800" height="1200"/>
  <text x="70" y="72" class="title">GyuOS 전체 구성도</text>
  <text x="72" y="106" class="subtitle">D:/github/persona-ai 전체 프로젝트 관점에서 보는 개인 AI OS, PC HUD, 업무 보조 앱, 데이터 저장소, 에이전트 실행 흐름</text>

  <rect x="55" y="140" width="1690" height="1005" rx="24" class="frame"/>

  <text x="90" y="190" class="section">사용자 접점</text>
  <rect x="80" y="220" width="250" height="100" class="card blue"/>
  <text x="108" y="257" class="label">웹 대시보드</text>
  <text x="108" y="284" class="small">personal_life/app/frontend</text>
  <text x="108" y="306" class="tiny">홈, 브리핑, 머니, 리포트 센터</text>

  <rect x="80" y="350" width="250" height="100" class="card blue"/>
  <text x="108" y="387" class="label">모바일 앱</text>
  <text x="108" y="414" class="small">Flutter app/mobile</text>
  <text x="108" y="436" class="tiny">음성/텍스트 명령 전송</text>

  <rect x="80" y="480" width="250" height="110" class="card blue"/>
  <text x="108" y="517" class="label">PC 음성 호출</text>
  <text x="108" y="544" class="small">pc_wake_listener.py</text>
  <text x="108" y="566" class="tiny">호출어, STT, TTS, 자막</text>

