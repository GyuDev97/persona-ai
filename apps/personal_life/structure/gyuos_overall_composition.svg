<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <defs>
    <style>
      .bg { fill: #f6f7fb; }
      .frame { fill: #ffffff; stroke: #d8dfec; stroke-width: 2; }
      .title { font: 800 42px "Segoe UI", "Malgun Gothic", sans-serif; fill: #172033; }
      .subtitle { font: 500 18px "Segoe UI", "Malgun Gothic", sans-serif; fill: #647087; }
      .section { font: 800 22px "Segoe UI", "Malgun Gothic", sans-serif; fill: #1d2a44; }
      .label { font: 800 19px "Segoe UI", "Malgun Gothic", sans-serif; fill: #1d2a44; }
      .small { font: 500 14px "Segoe UI", "Malgun Gothic", sans-serif; fill: #526078; }
      .tiny { font: 500 12px "Segoe UI", "Malgun Gothic", sans-serif; fill: #68758c; }
      .card { fill: #ffffff; stroke: #d8dfec; stroke-width: 1.5; rx: 14; }
