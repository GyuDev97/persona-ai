  <text x="820" y="902" class="small">agent_definitions, agent_status</text>
  <text x="820" y="926" class="small">agent_tasks, agent_log</text>
  <text x="820" y="950" class="small">agent_news_items, agent_reports</text>
  <text x="820" y="974" class="small">agent_blog_drafts</text>

  <rect x="1145" y="835" width="320" height="190" class="card gray"/>
  <text x="1175" y="872" class="label">개발 플래너 데이터</text>
  <text x="1175" y="902" class="small">agent_dev_projects</text>
  <text x="1175" y="926" class="small">agent_dev_proposals</text>
  <text x="1175" y="950" class="small">codex_task_id</text>
  <text x="1175" y="974" class="small">target_files, risk_level, status</text>

  <rect x="1500" y="835" width="160" height="190" class="card red"/>
  <text x="1522" y="872" class="label">외부 API</text>
  <text x="1522" y="902" class="small">OpenAI</text>
  <text x="1522" y="926" class="small">Google News RSS</text>
  <text x="1522" y="950" class="small">wttr.in Weather</text>
  <text x="1522" y="974" class="small">edge-tts</text>

  <text x="90" y="1080" class="section">한 줄 해석</text>
  <text x="90" y="1115" class="small">GyuOS는 personal_life FastAPI 서버를 중심으로 웹/모바일/음성 명령을 받고, 서비스 레이어가 생활/재정/기억/브리핑을 처리하며, agent_tasks 큐와 PC Runner가 Agent 01~04 작업을 비동기 실행하는 구조입니다.</text>

