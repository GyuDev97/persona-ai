  <text x="110" y="872" class="label">생활 데이터</text>
  <text x="110" y="902" class="small">tasks, schedules</text>
  <text x="110" y="926" class="small">routines, routine_checkins</text>
  <text x="110" y="950" class="small">quick_captures, reminders</text>
  <text x="110" y="974" class="small">profile_memories, conversations</text>

  <rect x="435" y="835" width="320" height="190" class="card gray"/>
  <text x="465" y="872" class="label">Money Core 데이터</text>
  <text x="465" y="902" class="small">income_summary, expenses</text>
  <text x="465" y="926" class="small">card_usage, installments</text>
  <text x="465" y="950" class="small">assets, asset_snapshots</text>
  <text x="465" y="974" class="small">assets_history, auto_transfer</text>

  <rect x="790" y="835" width="320" height="190" class="card gray"/>
