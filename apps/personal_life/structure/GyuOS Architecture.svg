<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260">
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .title { font: 800 40px "Segoe UI", "Malgun Gothic", sans-serif; fill: #172033; }
      .subtitle { font: 500 18px "Segoe UI", "Malgun Gothic", sans-serif; fill: #657086; }
      .section-title { font: 800 22px "Segoe UI", "Malgun Gothic", sans-serif; fill: #1d2a44; }
      .label { font: 700 18px "Segoe UI", "Malgun Gothic", sans-serif; fill: #1d2a44; }
      .small { font: 500 14px "Segoe UI", "Malgun Gothic", sans-serif; fill: #526078; }
      .tiny { font: 500 12px "Segoe UI", "Malgun Gothic", sans-serif; fill: #66748c; }
      .card { fill: #ffffff; stroke: #d9e0ec; stroke-width: 1.5; rx: 14; }
      .soft { fill: #eef4ff; stroke: #c8d9ff; }
      .green { fill: #ecf9f1; stroke: #b9e5c9; }
      .yellow { fill: #fff8e7; stroke: #f2d68c; }
      .red { fill: #fff0f0; stroke: #edb6b6; }
      .purple { fill: #f4f0ff; stroke: #d8c9ff; }
      .mint { fill: #ecfbf8; stroke: #b7e8df; }
      .line { stroke: #7d8aa2; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .line-strong { stroke: #3f6fd8; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .dash { stroke: #9aa6ba; stroke-width: 2; fill: none; stroke-dasharray: 7 7; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8aa2"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3f6fd8"/>
    </marker>
  </defs>

  <rect class="bg" width="1800" height="1260"/>

  <text x="70" y="75" class="title">GYUVIS 전체 구조도</text>
  <text x="72" y="108" class="subtitle">apps/personal_life 기준 FastAPI 라우트, 서비스, 에이전트 러너, 웨이크 리스너, 프론트엔드, DB, Money Core, Agent 03 개발 플래너 구조</text>

  <rect x="55" y="145" width="1690" height="1050" rx="24" fill="#ffffff" stroke="#d5ddea" stroke-width="2"/>

  <text x="95" y="195" class="section-title">진입 지점</text>
  <rect x="85" y="220" width="250" height="96" class="card soft"/>
  <text x="110" y="256" class="label">웹 프론트엔드</text>
  <text x="110" y="283" class="small">app/frontend/*.html</text>
  <text x="110" y="304" class="tiny">대시보드, 머니, 브리핑, 리포트 센터</text>

  <rect x="85" y="345" width="250" height="96" class="card soft"/>
  <text x="110" y="381" class="label">모바일 앱</text>
  <text x="110" y="408" class="small">app/mobile Flutter</text>
  <text x="110" y="429" class="tiny">모바일 어시스턴트 명령 클라이언트</text>

  <rect x="85" y="470" width="250" height="110" class="card soft"/>
  <text x="110" y="506" class="label">웨이크 리스너</text>
  <text x="110" y="533" class="small">pc_wake_listener.py</text>
  <text x="110" y="554" class="tiny">호출어, 음성 인식, 자막, 음성 출력</text>

  <text x="430" y="195" class="section-title">FastAPI 계층</text>
  <rect x="405" y="235" width="310" height="108" class="card"/>
  <text x="435" y="272" class="label">FastAPI 앱</text>
  <text x="435" y="300" class="small">main.py -> app.create_app()</text>
  <text x="435" y="321" class="tiny">CORS, DB 초기화, /shared 정적 파일</text>

  <rect x="405" y="395" width="310" height="170" class="card"/>
  <text x="435" y="432" class="label">routes.py</text>
  <text x="435" y="462" class="small">페이지: /, /{page}.html</text>
  <text x="435" y="486" class="small">생활: /tasks, /schedules, /captures</text>
  <text x="435" y="510" class="small">머니: /finance/*</text>
  <text x="435" y="534" class="small">에이전트: /agent/*</text>
  <text x="435" y="558" class="small">명령: /commands/natural, /mobile/*</text>

  <text x="805" y="195" class="section-title">서비스 계층</text>
  <rect x="770" y="220" width="315" height="92" class="card green"/>
  <text x="798" y="256" class="label">생활 코어 서비스</text>
  <text x="798" y="283" class="small">브리핑, 일정, 할 일, 루틴</text>
  <text x="798" y="304" class="tiny">캡처, 메모리, 리마인더, 대화 기록</text>

  <rect x="770" y="340" width="315" height="92" class="card yellow"/>
  <text x="798" y="376" class="label">Money Core</text>
  <text x="798" y="403" class="small">money_core_service.py</text>
  <text x="798" y="424" class="tiny">요약, 지출, 카드, 자산, 절약 팁</text>

  <rect x="770" y="460" width="315" height="92" class="card purple"/>
  <text x="798" y="496" class="label">어시스턴트 의도 분석</text>
  <text x="798" y="523" class="small">natural_language_service.py</text>
  <text x="798" y="544" class="tiny">모바일 명령, 자연어 명령, 라우팅</text>

  <rect x="770" y="580" width="315" height="106" class="card mint"/>
  <text x="798" y="616" class="label">에이전트 서비스</text>
  <text x="798" y="643" class="small">작업 큐, 상태, 대기 화면</text>
  <text x="798" y="666" class="small">리포트 센터, 에이전트 정의</text>

  <rect x="770" y="715" width="315" height="110" class="card red"/>
  <text x="798" y="751" class="label">Agent 03 개발 플래너</text>
  <text x="798" y="778" class="small">dev_planner_service.py</text>
  <text x="798" y="801" class="small">프로젝트, 스캔, 제안, 승인</text>

  <text x="1190" y="195" class="section-title">에이전트 실행부</text>
  <rect x="1160" y="230" width="290" height="92" class="card"/>
  <text x="1188" y="266" class="label">agent_tasks 큐</text>
  <text x="1188" y="293" class="small">대기 -> 점유 -> 완료/실패</text>
  <text x="1188" y="314" class="tiny">task_type 기준으로 실행 분기</text>

  <rect x="1160" y="360" width="290" height="112" class="card"/>
  <text x="1188" y="396" class="label">pc_agent_runner.py</text>
  <text x="1188" y="423" class="small">5초마다 작업 큐 확인</text>
  <text x="1188" y="446" class="small">Agent 01 예약 뉴스 수집</text>

  <rect x="1160" y="510" width="290" height="188" class="card"/>
  <text x="1188" y="546" class="label">Agent 01~04</text>
  <text x="1188" y="576" class="small">01 IT 뉴스 수집</text>
  <text x="1188" y="600" class="small">02 블로그 초안 / 네이버 입력</text>
  <text x="1188" y="624" class="small">03 Codex 업데이트 요청</text>
  <text x="1188" y="648" class="small">04 유튜브 아이디어 조사</text>
  <text x="1188" y="676" class="tiny">얇은 어댑터가 러너 함수 호출</text>

  <text x="1530" y="195" class="section-title">데이터베이스</text>
  <rect x="1500" y="230" width="200" height="590" class="card"/>
  <text x="1525" y="266" class="label">SQLite / MariaDB</text>
  <text x="1525" y="300" class="small">personal_life.db</text>
  <text x="1525" y="336" class="tiny">quick_captures</text>
  <text x="1525" y="358" class="tiny">tasks, schedules</text>
  <text x="1525" y="380" class="tiny">routines, reminders</text>
  <text x="1525" y="402" class="tiny">assistant_conversations</text>
  <text x="1525" y="434" class="tiny">agent_tasks</text>
  <text x="1525" y="456" class="tiny">agent_definitions</text>
  <text x="1525" y="478" class="tiny">agent_status, agent_log</text>
  <text x="1525" y="500" class="tiny">agent_news_items</text>
  <text x="1525" y="522" class="tiny">agent_reports</text>
  <text x="1525" y="544" class="tiny">agent_blog_drafts</text>
  <text x="1525" y="576" class="tiny">agent_dev_projects</text>
  <text x="1525" y="598" class="tiny">agent_dev_proposals</text>
  <text x="1525" y="630" class="tiny">income_summary</text>
  <text x="1525" y="652" class="tiny">expenses, card_usage</text>
  <text x="1525" y="674" class="tiny">installments</text>
  <text x="1525" y="696" class="tiny">assets_history</text>
  <text x="1525" y="718" class="tiny">auto_transfer</text>

  <text x="95" y="735" class="section-title">주요 흐름</text>
  <rect x="85" y="760" width="630" height="170" class="card"/>
  <text x="115" y="798" class="label">음성 / 모바일 명령 흐름</text>
  <text x="115" y="832" class="small">웨이크 리스너 또는 모바일 -> POST /mobile/assistant/command</text>
  <text x="115" y="858" class="small">mobile_assistant_service가 대화, 화면 열기, 상태 조회, 에이전트 작업으로 분기</text>
  <text x="115" y="884" class="small">에이전트 작업이면 DB 큐에 저장하고, 일반 답변이면 즉시 응답</text>

  <rect x="85" y="960" width="630" height="170" class="card yellow"/>
  <text x="115" y="998" class="label">Money Core 흐름</text>
  <text x="115" y="1032" class="small">money_core.html -> /finance/* -> money_core_service</text>
  <text x="115" y="1058" class="small">build_money_core_summary가 남은 현금, 카드 사용률, 저축률 계산</text>
  <text x="115" y="1084" class="small">브리핑 페이지와 finance_monthly_summary가 같은 요약을 재사용</text>

  <rect x="770" y="860" width="680" height="270" class="card red"/>
  <text x="805" y="900" class="label">Agent 03 개발 플래너 흐름</text>
  <text x="805" y="936" class="small">1. 리포트 센터가 /agent/dev-projects, /agent/dev-proposals 호출</text>
  <text x="805" y="964" class="small">2. dev_planner_service가 기본 GyuOS 프로젝트를 보장하고 파일을 스캔</text>
  <text x="805" y="992" class="small">3. 스캔 결과로 target_files와 risk_level이 있는 개발 제안 생성</text>
  <text x="805" y="1020" class="small">4. 승인하면 agent_tasks에 task_type=coding_app_update 작업 생성</text>
  <text x="805" y="1048" class="small">5. pc_agent_runner가 작업을 점유하고 Agent3Codex가 Codex 필요 보고</text>
  <text x="805" y="1076" class="small">6. 실제 코드 수정은 Codex/사용자 승인 루프에서 진행되는 구조</text>

  <path class="line-strong" d="M335 268 C365 268 375 289 405 289"/>
  <path class="line-strong" d="M335 393 C365 393 375 289 405 289"/>
  <path class="line-strong" d="M335 525 C365 525 375 480 405 480"/>
  <path class="line" d="M715 480 C740 480 745 506 770 506"/>
  <path class="line" d="M715 480 C742 480 745 633 770 633"/>
  <path class="line" d="M1085 633 C1115 633 1130 276 1160 276"/>
  <path class="line-strong" d="M1450 276 C1470 276 1480 276 1500 276"/>
  <path class="line-strong" d="M1450 416 C1470 416 1480 434 1500 434"/>
  <path class="line" d="M1085 386 C1120 386 1130 416 1160 416"/>
  <path class="line" d="M1085 770 C1120 770 1130 624 1160 624"/>
  <path class="dash" d="M1085 770 C1200 830 1340 850 1500 598"/>
  <path class="line" d="M715 480 C740 480 745 386 770 386"/>
  <path class="line" d="M1085 386 C1190 860 1360 900 1500 652"/>

  <rect x="85" y="1160" width="1615" height="1" fill="#d9e0ec"/>
  <text x="95" y="1188" class="tiny">D:/github/persona-ai/apps/personal_life 프로젝트 구조를 기반으로 생성한 피그마형 구조도입니다.</text>
</svg>
