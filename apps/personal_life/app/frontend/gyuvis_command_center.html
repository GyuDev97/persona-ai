<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GYUVIS Command Center</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #11151a;
      --surface: #1b222a;
      --surface-elevated: #202832;
      --line: rgba(255,255,255,.06);
      --line-strong: rgba(255,255,255,.10);
      --text: #f4f6f8;
      --muted: #9ba6b2;
      --dim: #6f7b88;
      --accent: #4da3ff;
      --accent-soft: rgba(77,163,255,.14);
      --green: #55c782;
      --yellow: #e7bd62;
      --red: #ef7474;
      --shadow: 0 14px 35px rgba(0,0,0,.18);
      font-family: "Segoe UI", "Malgun Gothic", "맑은 고딕", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 980px; min-height: 100vh; background: radial-gradient(ellipse 65% 42% at 50% 34%, #18222d 0%, transparent 68%), linear-gradient(135deg, #11151a, #171c22); color: var(--text); }
    button, input { font: inherit; }
    button { color: inherit; cursor: pointer; }
    .shell { min-height: 100vh; padding: clamp(18px, 2.2vw, 38px); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: clamp(16px, 1.5vw, 25px); }
    .app-header { min-height: 42px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
    .brand { display: flex; align-items: center; gap: 11px; font-size: 14px; font-weight: 700; letter-spacing: .03em; }
    .brand-mark { width: 36px; height: 36px; color: var(--accent); }
    .product-title { text-align: center; line-height: 1.2; }
    .product-title strong { display: block; letter-spacing: .2em; font-size: clamp(14px, 1.25vw, 21px); font-weight: 600; }
    .product-title span { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; letter-spacing: .04em; }
    .window-actions { justify-self: end; display: flex; gap: 4px; }
    .window-actions span { width: 31px; height: 28px; display: grid; place-items: center; color: var(--muted); font-size: 17px; border-radius: 8px; }
    .dashboard { display: grid; grid-template-columns: minmax(250px, .88fr) minmax(420px, 1.55fr) minmax(280px, .96fr); gap: clamp(14px, 1.25vw, 22px); min-height: 0; }
    .panel { min-width: 0; border: 1px solid var(--line); border-radius: 16px; background: linear-gradient(150deg, rgba(31,39,49,.86), rgba(24,30,37,.80)); box-shadow: var(--shadow); backdrop-filter: blur(10px); }
    .panel-heading { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 21px 20px 14px; }
    .panel-heading h2 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: .02em; }
    .panel-heading .subtle { color: var(--muted); font-size: 12px; }
    .status-panel { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; }
    .agent-list { padding: 0 14px 14px; display: grid; align-content: start; gap: 10px; overflow: auto; }
    .agent-card { width: 100%; min-height: 118px; padding: 14px; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; grid-template-rows: auto auto 1fr; column-gap: 12px; text-align: left; border: 1px solid var(--line); border-radius: 13px; background: rgba(12,17,22,.18); transition: background .18s ease, border-color .18s ease, transform .18s ease; }
    .agent-card:hover { background: rgba(255,255,255,.035); border-color: var(--line-strong); transform: translateY(-1px); }
    .agent-icon { grid-row: 1 / span 3; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; color: #b8dcff; background: rgba(77,163,255,.13); border: 1px solid rgba(77,163,255,.16); font-size: 18px; }
    .agent-card[data-agent="2"] .agent-icon { color:#d6c0ff; background:rgba(151,110,241,.15); border-color:rgba(151,110,241,.19); }
    .agent-card[data-agent="3"] .agent-icon { color:#a6eee6; background:rgba(59,178,168,.14); border-color:rgba(59,178,168,.18); }
    .agent-card[data-agent="4"] .agent-icon { color:#ffb7b7; background:rgba(227,99,99,.14); border-color:rgba(227,99,99,.18); }
    .agent-title { min-width: 0; display: flex; align-items: baseline; gap: 7px; }
    .agent-title strong { font-size: 14px; white-space: nowrap; }
    .agent-title span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 13px; }
    .agent-status { align-self: center; display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 12px; }
    .agent-status i { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
    .agent-status.running { color: #8ec6ff; }.agent-status.running i { background: var(--accent); }.agent-status.active { color: #8edfa8; }.agent-status.active i { background: var(--green); }.agent-status.error { color: #ff9f9f; }.agent-status.error i { background: var(--red); }
    .agent-summary { grid-column: 2 / 4; margin: 6px 0 0; color: var(--muted); font-size: 12px; line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .agent-meta { align-self: end; color: var(--dim); font-size: 11px; white-space: nowrap; }
    .agent-total { padding: 15px 20px 19px; color: var(--muted); border-top: 1px solid var(--line); font-size: 12px; }.agent-total strong { color: var(--accent); font-weight: 600; }
    .core-panel { position: relative; display: grid; grid-template-rows: 1fr auto; min-height: 0; overflow: hidden; }
    .core-panel::before { content:""; position:absolute; width: 520px; height: 460px; top: 6%; left: 50%; transform: translateX(-50%); background: radial-gradient(circle, rgba(77,163,255,.10), transparent 65%); pointer-events:none; }
    .core-content { position: relative; min-height: 0; padding: clamp(38px, 7vh, 98px) 28px 28px; display: grid; place-content: center; justify-items: center; text-align: center; }
    .core-orb { position: relative; width: clamp(178px, 17vw, 260px); aspect-ratio: 1; display: grid; place-items: center; border: 2px solid rgba(147,165,185,.36); border-radius: 50%; transition: border-color .35s ease, box-shadow .35s ease, transform .35s ease; }
    .core-orb::before { content:""; position:absolute; inset: -2px; border-radius:inherit; border: 2px solid transparent; border-top-color: var(--accent); border-right-color: var(--accent); transform: rotate(25deg); opacity: .88; }
    .core-orb::after { content:""; position:absolute; inset: 14%; border: 1px solid rgba(255,255,255,.06); border-radius: inherit; }
    .waveform { height: 65px; display: flex; align-items:center; gap: 5px; z-index: 1; }.waveform i { width: 4px; height: var(--h); background: #9fd0ff; border-radius: 99px; opacity: .85; transition: height .25s ease; }
    .core-message { margin: 29px 0 0; font-size: clamp(21px, 1.75vw, 30px); letter-spacing: -.035em; font-weight: 500; }.core-state { margin-top: 12px; color: #a5cdf7; font-size: 14px; }
    .core-panel[data-state="listening"] .core-orb { border-color: rgba(77,163,255,.70); box-shadow: 0 0 0 10px rgba(77,163,255,.05); }.core-panel[data-state="listening"] .core-orb::before { animation: orbit 2.8s linear infinite; }.core-panel[data-state="listening"] .waveform i { animation: wave .75s ease-in-out infinite alternate; }.core-panel[data-state="processing"] .core-orb { transform: scale(.98); border-color: rgba(231,189,98,.68); }.core-panel[data-state="processing"] .core-orb::before { border-top-color: var(--yellow); border-right-color: var(--yellow); animation: orbit 1.1s linear infinite; }.core-panel[data-state="speaking"] .core-orb { border-color: rgba(85,199,130,.66); }.core-panel[data-state="speaking"] .waveform i { background: #93ddb0; animation: wave .45s ease-in-out infinite alternate; }
    @keyframes orbit { to { transform: rotate(385deg); } } @keyframes wave { to { height: calc(var(--h) * 1.45); } }
    .command-box { position: relative; margin: 0 clamp(22px, 4vw, 58px) clamp(23px, 3vw, 42px); padding: 8px; display: grid; grid-template-columns: 47px minmax(0, 1fr) 47px; gap: 5px; align-items: center; border: 1px solid rgba(122,178,239,.30); border-radius: 15px; background: rgba(10,15,20,.30); transition: border-color .22s ease, background .22s ease; }.command-box:focus-within,.command-box.listening { border-color: rgba(77,163,255,.72); background: rgba(77,163,255,.055); }.command-box.processing { border-color: rgba(231,189,98,.55); }
    .icon-button { width: 39px; height: 39px; display: grid; place-items:center; border: 0; border-radius: 10px; background: transparent; color: var(--muted); }.icon-button:hover { background: rgba(255,255,255,.055); color: var(--text); }.mic-button.listening { color: var(--accent); background: var(--accent-soft); }.send-button { color: #b8d9ff; }.send-button:disabled { opacity: .42; cursor: default; }
    .command-input { width: 100%; min-width:0; padding: 10px 2px; border: 0; outline: none; color: var(--text); background: transparent; font-size: 15px; }.command-input::placeholder { color: #72808e; }
    .right-panel { display: grid; grid-template-rows: minmax(0, 1.04fr) minmax(0, .96fr); gap: 14px; min-height: 0; }
    .system-panel,.notification-panel { min-height: 0; overflow: hidden; }.system-list { padding: 0 20px 14px; }.system-row { display:grid; grid-template-columns: 23px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--line); }.system-row:last-child { border-bottom: 0; }.system-icon { color: #c6d2dc; font-size: 17px; }.system-name { font-size: 13px; }.system-meta { min-width: 0; color: var(--muted); font-size: 11px; }.system-value { color: #d8e5f2; font-size: 12px; white-space: nowrap; }.meter { grid-column: 2 / 4; height: 4px; overflow: hidden; border-radius: 99px; background: rgba(255,255,255,.075); }.meter i { display:block; width: var(--meter, 0%); height:100%; border-radius:inherit; background: var(--accent); transition: width .3s ease; }.meter.neutral i { background: #758493; }
    .notification-list { padding: 0 14px 13px; display:grid; gap: 8px; overflow: auto; }.notification { min-height: 58px; padding: 10px 11px; display:grid; grid-template-columns: 20px minmax(0,1fr) auto; align-items:start; gap:8px; border: 1px solid var(--line); border-radius: 11px; background: rgba(10,15,20,.14); }.notification-icon { color: var(--accent); line-height: 1.1; }.notification strong { font-size: 12px; font-weight: 600; }.notification p { margin: 4px 0 0; overflow:hidden; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:1; color: var(--muted); font-size: 11px; line-height: 1.35; }.notification time { color: var(--dim); font-size: 10px; white-space:nowrap; }
    .dock { display:grid; grid-template-columns: repeat(5,minmax(0,1fr)); gap: 12px; }.dock-item { min-height: 78px; padding: 12px 14px; display:grid; grid-template-columns: 38px minmax(0,1fr); align-items:center; gap: 11px; text-align:left; border: 1px solid var(--line); border-radius: 13px; background: rgba(27,34,42,.72); box-shadow: 0 10px 25px rgba(0,0,0,.11); transition: transform .18s ease, background .18s ease, border-color .18s ease; }.dock-item:hover { transform: translateY(-2px); background: rgba(38,47,57,.9); border-color: var(--line-strong); }.dock-icon { width:38px; height:38px; display:grid; place-items:center; border-radius: 11px; color:#b8dcff; background:rgba(77,163,255,.13); font-size: 18px; }.dock-item:nth-child(1) .dock-icon{color:#b5e1a5;background:rgba(99,178,81,.16)}.dock-item:nth-child(3) .dock-icon{color:#d6b5ff;background:rgba(157,101,230,.16)}.dock-item:nth-child(4) .dock-icon{color:#ffd087;background:rgba(212,151,66,.16)}.dock-item:nth-child(5) .dock-icon{color:#b7ddff;background:rgba(77,163,255,.14)}.dock-item strong { display:block; font-size:13px; font-weight:600; }.dock-item small { display:block; margin-top:4px; color:var(--muted); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .screen-reader { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }
    @media (max-width: 1500px) { .dashboard { grid-template-columns: minmax(230px,.86fr) minmax(390px,1.52fr) minmax(245px,.9fr); }.agent-card{min-height:108px}.agent-summary{font-size:11px}.dock-item{padding:10px}.dock-item small{font-size:10px} }
    @media (max-width: 1150px) { body{min-width:760px}.shell{padding:16px}.dashboard{grid-template-columns: 230px minmax(0,1fr);}.right-panel{grid-column: 1 / -1; grid-template-columns:1fr 1fr; min-height:260px}.core-content{padding-top:34px}.dock{gap:8px}.dock-item{grid-template-columns:32px minmax(0,1fr)}.dock-icon{width:32px;height:32px}.dock-item small{display:none} }
  </style>
</head>
<body>
  <div class="shell">
    <header class="app-header">
      <div class="brand"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M16 2 4 8.8v14.4L16 30l12-6.8V8.8L16 2Zm0 3.5 8.9 5.1v10.8L16 26.5l-8.9-5.1V10.6L16 5.5Zm0 3.5-5.8 3.3v7.4l5.8 3.3 5.8-3.3v-3.1h-7v2.5h4.4v2.1L16 20.3l-3.2-1.8v-4.2l3.2-1.8 3.2 1.8v1.1h2.6v-2.6L16 9Z"/></svg><span>GYUVIS</span></div>
      <div class="product-title"><strong>GYUVIS COMMAND CENTER</strong><span>Personal AI Operating Interface</span></div>
      <div class="window-actions" aria-hidden="true"><span>−</span><span>□</span><span>×</span></div>
    </header>
    <main class="dashboard">
      <aside class="panel status-panel" aria-label="Agent Status">
        <div class="panel-heading"><h2>AGENT STATUS</h2><span class="subtle" id="agentRefreshLabel">동기화 중</span></div>
        <div class="agent-list" id="agentList" aria-live="polite"></div>
        <div class="agent-total" id="agentTotal">전체 에이전트 상태 <strong>확인 중</strong></div>
      </aside>
      <section class="panel core-panel" id="corePanel" data-state="idle" aria-label="GYUVIS Core">
        <div class="core-content">
          <div class="core-orb" aria-hidden="true"><div class="waveform"><i style="--h:14px"></i><i style="--h:25px"></i><i style="--h:38px"></i><i style="--h:53px"></i><i style="--h:39px"></i><i style="--h:27px"></i><i style="--h:16px"></i></div></div>
          <div class="core-message" id="coreGreeting">안녕하세요, 무엇을 도와드릴까요?</div>
          <div class="core-state" id="coreStateText">Ready</div>
        </div>
        <form class="command-box" id="commandForm">
          <button class="icon-button mic-button" id="voiceButton" type="button" aria-label="음성 명령 시작"><span aria-hidden="true">♩</span></button>
          <input class="command-input" id="commandInput" name="text" autocomplete="off" placeholder="규비스, 브리핑 시작" aria-label="GYUVIS 명령 입력">
          <button class="icon-button send-button" id="sendButton" type="submit" aria-label="명령 전송"><span aria-hidden="true">➤</span></button>
        </form>
      </section>
      <aside class="right-panel" aria-label="System information and notifications">
        <section class="panel system-panel"><div class="panel-heading"><h2>SYSTEM INFO</h2><span class="subtle">30초 갱신</span></div><div class="system-list" id="systemList"></div></section>
        <section class="panel notification-panel"><div class="panel-heading"><h2>NOTIFICATIONS</h2><span class="subtle" id="notificationCount">최근 활동</span></div><div class="notification-list" id="notificationList"></div></section>
      </aside>
    </main>
    <nav class="dock" aria-label="GYUVIS modules">
      <button class="dock-item" type="button" data-path="/money-core"><span class="dock-icon">▣</span><span><strong>Money Core</strong><small>자산 관리 및 분석</small></span></button>
      <button class="dock-item" type="button" data-path="/drive.html"><span class="dock-icon">▰</span><span><strong>Car System</strong><small>차량 관리 및 모니터링</small></span></button>
      <button class="dock-item" type="button" data-path="/creator.html"><span class="dock-icon">◉</span><span><strong>Creator Studio</strong><small>콘텐츠 제작 도구</small></span></button>
      <button class="dock-item" type="button" data-path="/agent/report-center"><span class="dock-icon">▤</span><span><strong>Report Center</strong><small>Agent 보고서 및 분석</small></span></button>
      <button class="dock-item" type="button" data-path="/briefing.html"><span class="dock-icon">●</span><span><strong>Briefing</strong><small>일일 브리핑 및 요약</small></span></button>
    </nav>
  </div>
  <script>
    const $ = (selector) => document.querySelector(selector);
    const agentNames = { 1: "IT News", 2: "Blog Draft", 3: "Codex Tasks", 4: "YouTube Ideas" };
    const agentIcons = { 1: "▤", 2: "✎", 3: "‹/›", 4: "▶" };
    const core = { panel: $("#corePanel"), greeting: $("#coreGreeting"), state: $("#coreStateText"), input: $("#commandInput"), voice: $("#voiceButton"), form: $("#commandForm"), send: $("#sendButton") };
    const voice = { recognition: null, active: false, speak: false };
    let currentReport = null;
    let currentSystem = null;

    const escapeHtml = (value) => String(value ?? "").replace(/[&<>'"]/g, (char) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", "'":"&#39;", '"':"&quot;" }[char]));
    const request = async (url, options = {}) => { const response = await fetch(url, { headers: { "Content-Type":"application/json" }, ...options }); if (!response.ok) throw new Error(await response.text()); return response.json(); };
    const formatWhen = (value) => { if (!value) return "기록 없음"; const date = new Date(value); if (Number.isNaN(date.getTime())) return String(value); const diff = Math.max(0, Date.now() - date.getTime()); if (diff < 60000) return "방금 전"; if (diff < 3600000) return `${Math.floor(diff / 60000)}분 전`; if (diff < 86400000) return `${Math.floor(diff / 3600000)}시간 전`; return date.toLocaleDateString("ko-KR", { month:"numeric", day:"numeric" }); };
    const normalizeStatus = (value) => { const raw = String(value || "idle").toLowerCase(); if (/error|fail|확인 필요/.test(raw)) return { key:"error", label:"Error" }; if (/running|processing|진행/.test(raw)) return { key:"running", label:"Running" }; if (/active|활성|complete|완료/.test(raw)) return { key:"active", label:"Active" }; return { key:"idle", label:"Idle" }; };
    function setCoreState(next, note) { const labels = { idle:"Ready", listening:"Listening", processing:"Processing", speaking:"Speaking" }; core.panel.dataset.state = next; core.state.textContent = note || labels[next] || "Ready"; core.form.classList.toggle("listening", next === "listening"); core.form.classList.toggle("processing", next === "processing"); core.voice.classList.toggle("listening", next === "listening"); core.voice.setAttribute("aria-label", next === "listening" ? "음성 명령 중지" : "음성 명령 시작"); }
    function renderAgents(report, system) {
      const cards = (report?.cards || []).slice().sort((a,b) => Number(a.agent_id) - Number(b.agent_id));
      const tracked = new Map((system?.agents || []).map((agent) => [Number(agent.id), agent]));
      const rows = [1,2,3,4].map((id) => { const card = cards.find((item) => Number(item.agent_id) === id) || {}; const runtime = tracked.get(id) || {}; const status = normalizeStatus(runtime.status || card.tone || card.status); const summary = runtime.error || card.error_message || card.latest_result_summary || card.description || "최근 작업 정보를 기다리고 있습니다."; const time = runtime.last_run_at || runtime.last_success_at || card.updated_at; return `<button class="agent-card" type="button" data-agent="${id}" data-path="/agent/report-center?agent=${id}"><span class="agent-icon">${agentIcons[id]}</span><span class="agent-title"><strong>Agent ${String(id).padStart(2,"0")}</strong><span>${escapeHtml(card.title || agentNames[id])}</span></span><span class="agent-status ${status.key}"><i></i>${status.label}</span><span class="agent-summary">${escapeHtml(summary)}</span><span class="agent-meta">${escapeHtml(formatWhen(time))}</span></button>`; });
      $("#agentList").innerHTML = rows.join("");
      const errors = (system?.agents || []).filter((agent) => normalizeStatus(agent.status).key === "error").length;
      $("#agentTotal").innerHTML = `전체 에이전트 상태 <strong>${4 - errors} / 4 ${errors ? "정상 · 확인 필요 " + errors : "정상"}</strong>`;
      $("#agentRefreshLabel").textContent = report?.updated_at ? `업데이트 ${formatWhen(report.updated_at)}` : "동기화 완료";
      renderNotifications(cards, tracked);
    }
    function systemRow(icon, name, meta, value, meter = 0, tone = "neutral") { return `<div class="system-row"><span class="system-icon">${icon}</span><span class="system-name">${name}<span class="system-meta"> · ${escapeHtml(meta)}</span></span><span class="system-value">${escapeHtml(value)}</span><span class="meter ${tone}" style="--meter:${meter}%"><i></i></span></div>`; }
    function getGpuName() { try { const canvas = document.createElement("canvas"); const gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl"); if (!gl) return "미제공"; const debug = gl.getExtension("WEBGL_debug_renderer_info"); return debug ? gl.getParameter(debug.UNMASKED_RENDERER_WEBGL).replace(/^ANGLE \([^,]+, /, "").replace(/,.*\)$/, "") : "WebGL"; } catch { return "미제공"; } }
    function renderSystem(system) { const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection; const memory = performance.memory; const heapRate = memory?.jsHeapSizeLimit ? Math.round(memory.usedJSHeapSize / memory.jsHeapSizeLimit * 100) : 0; const serverOnline = String(system?.server || "").toLowerCase() === "running"; const dbOnline = String(system?.db || "").toLowerCase() === "connected"; const wake = normalizeStatus(system?.wake_listener); const network = connection?.downlink ? `${connection.downlink} Mbps` : (navigator.onLine ? "Online" : "Offline"); const ram = navigator.deviceMemory ? `${navigator.deviceMemory} GB` : "미제공"; const cpu = navigator.hardwareConcurrency ? `${navigator.hardwareConcurrency} cores` : "미제공"; const gpu = getGpuName(); const rows = [systemRow("▦", "CPU", "브라우저 논리 코어", cpu, 0), systemRow("▣", "GPU", "WebGL 장치", gpu, 0), systemRow("▤", "RAM", memory ? "브라우저 heap" : "기기 메모리", memory ? `${heapRate}%` : ram, memory ? heapRate : 0), systemRow("⌁", "Network", connection?.effectiveType || "브라우저 연결", network, navigator.onLine ? 100 : 0), systemRow("▰", "Local Server", `${dbOnline ? "DB 연결됨" : "DB 확인 필요"} · Wake ${wake.label}`, serverOnline ? "Running" : "Offline", serverOnline ? 100 : 0)]; $("#systemList").innerHTML = rows.join(""); if (core.panel.dataset.state === "idle") core.state.textContent = `Ready · Wake ${wake.label}`; }
    function renderNotifications(cards, tracked) { const items = cards.slice(0, 5).map((card, index) => { const id = Number(card.agent_id) || index + 1; const runtime = tracked.get(id) || {}; const summary = runtime.error || card.error_message || card.latest_result_summary || card.description || "새로운 상태가 없습니다."; const time = runtime.last_run_at || runtime.last_success_at || card.updated_at; return `<div class="notification"><span class="notification-icon">${agentIcons[id] || "•"}</span><div><strong>${escapeHtml(card.title || agentNames[id] || `Agent ${id}`)}</strong><p>${escapeHtml(summary)}</p></div><time>${escapeHtml(formatWhen(time))}</time></div>`; }); $("#notificationList").innerHTML = items.length ? items.join("") : `<div class="notification"><span class="notification-icon">•</span><div><strong>알림 없음</strong><p>최근 Agent 이벤트를 기다리고 있습니다.</p></div></div>`; $("#notificationCount").textContent = items.length ? `최근 ${items.length}개` : "최근 활동"; }
    async function refreshDashboard() { try { const [report, system] = await Promise.all([request("/agent/report-center/data"), request("/system/status")]); currentReport = report; currentSystem = system; renderAgents(report, system); renderSystem(system); } catch (error) { console.warn("GYUVIS dashboard refresh failed", error); $("#agentRefreshLabel").textContent = "연결 확인 필요"; renderSystem(currentSystem); } }
    function initVoice() { const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition; if (!Recognition) { core.voice.disabled = true; core.voice.title = "이 브라우저는 음성 인식을 지원하지 않습니다."; return; } const recognition = new Recognition(); recognition.lang = "ko-KR"; recognition.interimResults = false; recognition.maxAlternatives = 1; recognition.onstart = () => { voice.active = true; setCoreState("listening"); }; recognition.onend = () => { voice.active = false; if (core.panel.dataset.state !== "speaking") setCoreState("idle"); }; recognition.onerror = (event) => { voice.active = false; setCoreState("idle", event.error === "not-allowed" ? "마이크 권한 필요" : "Ready"); }; recognition.onresult = (event) => { const text = Array.from(event.results || []).map((item) => item?.[0]?.transcript || "").join(" ").trim(); if (text) { core.input.value = text; core.form.requestSubmit(); } }; voice.recognition = recognition; }
    function speakReply(text) { if (!("speechSynthesis" in window) || !text) return; window.speechSynthesis.cancel(); const utterance = new SpeechSynthesisUtterance(text); utterance.lang = "ko-KR"; utterance.onstart = () => setCoreState("speaking"); utterance.onend = () => setCoreState("idle"); utterance.onerror = () => setCoreState("idle"); window.speechSynthesis.speak(utterance); }
    core.voice.addEventListener("click", () => { if (!voice.recognition) return; voice.active ? voice.recognition.stop() : voice.recognition.start(); });
    core.form.addEventListener("submit", async (event) => { event.preventDefault(); const text = core.input.value.trim(); if (!text) return; setCoreState("processing"); core.send.disabled = true; try { const result = await request("/commands/natural", { method:"POST", body:JSON.stringify({ text }) }); core.input.value = ""; core.greeting.textContent = result.summary || "명령을 처리했습니다."; if (voice.active) voice.recognition.stop(); if (voice.speak) speakReply(result.summary); else setCoreState("idle"); } catch (error) { core.greeting.textContent = "명령을 처리하지 못했습니다. 다시 시도해주세요."; setCoreState("idle", "연결 확인 필요"); } finally { core.send.disabled = false; } });
    document.addEventListener("click", (event) => { const item = event.target.closest("[data-path]"); if (item) window.location.href = item.dataset.path; });
    initVoice(); setCoreState("idle"); refreshDashboard(); window.setInterval(refreshDashboard, 30000); window.addEventListener("online", () => renderSystem(currentSystem)); window.addEventListener("offline", () => renderSystem(currentSystem));
  </script>
