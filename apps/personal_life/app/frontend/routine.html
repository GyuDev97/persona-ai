<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GyuOS - 루틴 & 목표</title>
<link rel="stylesheet" href="/shared/gyuos-shell.css" />
<script src="/shared/gyuos-shell.js" defer></script>
<style>
:root{--bg:#fbf8f3;--panel:#fffdfa;--line:#eee4da;--text:#1f1a17;--muted:#8b8178;--brand:#b9652f;--brand2:#f4e7dc;--green:#2aa66a;--red:#ef4740;--blue:#4b86f7;--orange:#ed9b2f;--shadow:0 10px 30px rgba(80,52,30,.07)}
*{box-sizing:border-box}body{margin:0;font-family:"Malgun Gothic","맑은 고딕","Nanum Gothic","나눔고딕",Arial,sans-serif;background:radial-gradient(circle at top,#fff 0,#fbf8f3 42%,#f8f3eb 100%);color:var(--text)}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;padding:30px 20px;border-right:1px solid var(--line);background:rgba(255,252,247,.78);backdrop-filter:blur(14px);display:flex;flex-direction:column}.logo{font-size:30px;font-weight:800;color:#4a2a17}.sub{font-size:13px;color:#756b62;margin-top:5px}.nav{margin-top:34px;display:grid;gap:8px}.nav a{display:flex;align-items:center;gap:14px;padding:14px 15px;border-radius:12px;text-decoration:none;color:#2c2926;font-weight:650}.nav a.active{background:#f3e7dc;color:#a75725}.nav .ico{width:22px;text-align:center;font-size:18px}.assistant{margin-top:auto;padding:24px 18px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.bot{width:78px;height:78px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#fff,#ead8c6);font-size:38px}.btn{background:linear-gradient(135deg,#c87338,#a95422);border:0;color:#fff;border-radius:10px;padding:12px 20px;font-weight:800;cursor:pointer}.ver{margin-top:26px;color:#aaa;font-size:12px}.main{padding:22px 28px 34px;max-width:1480px}.topbar{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}.search{justify-self:center;width:min(720px,100%);height:44px;border:1px solid var(--line);background:#fff;border-radius:14px;box-shadow:var(--shadow);display:flex;align-items:center;padding:0 16px;color:#b7ada4;font-size:14px}.kbd{margin-left:auto;color:#777;background:#f7f2ed;border:1px solid var(--line);padding:3px 8px;border-radius:7px}.user{display:flex;align-items:center;gap:18px}.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#6fa1c8,#f0c39b)}.hero{display:flex;justify-content:space-between;align-items:flex-end;margin:22px 6px 22px}.hero h1{margin:0 0 8px;font-size:29px}.hero p{margin:0;color:#81766d}.weather{display:flex;align-items:center;gap:24px;color:#6d625a}.sun{font-size:36px}.tabs{display:flex;gap:30px;margin:8px 6px 18px;border-bottom:1px solid var(--line)}.tabs span{padding:0 0 12px;color:#594f47;font-weight:700}.tabs .on{color:#a75725;border-bottom:2px solid #a75725}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.card{background:rgba(255,255,255,.82);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.metric{padding:22px}.label{display:flex;gap:10px;align-items:center;color:#5c514a;font-weight:750;font-size:14px}.value{font-size:26px;font-weight:850;margin:20px 0 8px}.small{color:#7e736a;font-size:13px}.green{color:var(--green)}.red{color:var(--red)}.grid{margin-top:16px;display:grid;grid-template-columns:1.05fr 1fr .9fr;gap:16px}.span2{grid-column:span 2}.card h3{margin:0 0 16px;font-size:17px}.section{padding:22px}.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #f0e8df}.row:last-child{border-bottom:0}.badge{font-size:12px;padding:5px 9px;border-radius:999px;background:#f5eadf;color:#a75725;font-weight:800}.grow{flex:1}.muted{color:var(--muted);font-size:13px}.pill{padding:5px 9px;border-radius:999px;background:#edf4ff;color:#3777ea;font-size:12px;font-weight:800}.timeline .time{width:58px;font-weight:750}.dot{width:9px;height:9px;border-radius:50%;background:#ef4740}.dot.o{background:#ed9b2f}.dot.g{background:#bbb}.donut{width:172px;height:172px;border-radius:50%;background:conic-gradient(#d74335 0 32%,#f0a22e 32% 50%,#edd36a 50% 66%,#79c7bd 66% 80%,#73a5f1 80% 100%);position:relative;margin:8px auto}.donut:after{content:'총 소비\A ₩1,280,000\A 예산 대비 64%';white-space:pre;position:absolute;inset:34px;border-radius:50%;background:white;display:grid;place-items:center;text-align:center;font-weight:800;font-size:13px;line-height:1.7}.money{display:grid;grid-template-columns:220px 1fr;gap:20px}.legend{display:grid;gap:12px}.legend div{display:flex;justify-content:space-between}.carbox{display:grid;grid-template-columns:160px 1fr;gap:16px}.car{height:92px;border-radius:16px;background:linear-gradient(160deg,#e8ecef,#fff);display:grid;place-items:center;font-size:58px}.content img{width:64px;height:64px;object-fit:cover;border-radius:12px;background:#ddd}.thumb{width:64px;height:64px;border-radius:12px;background:linear-gradient(135deg,#0f2742,#7fb5d6);display:grid;place-items:center;color:white;font-weight:900;flex:none}.progress{height:6px;background:#eee6de;border-radius:99px;overflow:hidden}.bar{height:100%;background:#d36d28;border-radius:99px}.action{display:flex;justify-content:space-between;align-items:center;background:#fbf2ea;border-radius:12px;padding:12px 14px;margin-top:10px}.plus{width:34px;height:34px;border-radius:50%;background:#fbf2ea;display:grid;place-items:center;color:#a75725;font-size:22px}.footerGrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.contentlist .row{padding:9px 0}@media(max-width:1100px){.app{grid-template-columns:1fr}.sidebar{display:none}.metrics{grid-template-columns:repeat(2,1fr)}.grid,.footerGrid{grid-template-columns:1fr}.span2{grid-column:auto}.main{padding:18px}.weather{display:none}.money{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <gyuos-sidebar active="routine" card-title="Gyu Assistant" card-text="무엇이든 물어보세요."></gyuos-sidebar>
  <main class="main"><gyuos-header title="루틴 & 목표" subtitle="반복 습관과 목표 진행률을 관리하세요."></gyuos-header>
  <section class="metrics"><div class="card metric"><div class="label">🗓 오늘 일정</div><div class="value">2 <small>건</small></div><div class="small">10:00 대표 미팅</div></div><div class="card metric"><div class="label">💳 이번 달 소비</div><div class="value">452,600 <small>원</small></div><div class="small">지난 달 대비 <span class="red">+12%</span></div></div><div class="card metric"><div class="label">🚘 차량 상태</div><div class="value">D-18</div><div class="small">보험 만기 예정</div></div><div class="card metric"><div class="label">✅ 루틴</div><div class="value">66<small>%</small></div><div class="small">목표 진행률</div></div><div class="card metric"><div class="label">📈 콘텐츠</div><div class="value">2,340</div><div class="small">최근 7일 조회수</div></div></section><section class="grid"><div class="card section"><h3>오늘의 루틴</h3><div class="row"><span>✅</span><b class="grow">아침 운동</b><span class="green">완료</span></div><div class="row"><span>🟠</span><div class="grow"><b>영어 공부</b><div class="progress"><div class="bar" style="width:60%"></div></div></div><b>60%</b></div><div class="row"><span>🟠</span><div class="grow"><b>블로그 포스팅</b><div class="progress"><div class="bar" style="width:50%"></div></div></div><b>2/4</b></div></div><div class="card section"><h3>목표</h3><div class="value">66%</div><p class="muted">이번 달 전체 목표 진행률</p></div></section></main></div>
</body>
</html>
