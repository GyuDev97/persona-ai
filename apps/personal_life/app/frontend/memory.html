<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GyuNexus - 기억 검색</title>
<link rel="stylesheet" href="/shared/gyuos-shell.css" />
<script src="/shared/gyuos-shell.js" defer></script>
<style>
:root{--warm:#fbfaf7;--surface:#fff;--line:#e8eaf0;--text:#172033;--muted:#7a8496;--orange:#f27a3d;--orange-soft:#fff2e9;--green:#20b26b;--red:#ef5d53;--shadow:0 10px 28px rgba(28,39,60,.06)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fffdfa,#f7f5f1);color:var(--text);font-family:var(--gy-font)}.app{display:grid;grid-template-columns:var(--gy-shell-sidebar) minmax(0,1fr);min-height:100vh}.main{max-width:1400px;padding:28px 32px 42px}.memory-toolbar{display:flex;gap:14px;align-items:center;margin:0 0 20px}.memory-search{display:flex;align-items:center;gap:11px;flex:1;min-height:50px;padding:0 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);color:var(--muted)}.memory-search svg{width:19px;height:19px;stroke:#4e9dda;fill:none;stroke-width:2}.memory-search input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:var(--text);font:inherit}.memory-search input::placeholder{color:#9ba3b1}.memory-refresh,.memory-more{display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;background:#fff;color:#697386;cursor:pointer}.memory-refresh{width:44px;height:44px}.memory-refresh:hover{color:var(--orange);border-color:#f6c8ae}.memory-refresh svg,.memory-more svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8}.metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}.metric{min-height:128px;padding:18px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.9);box-shadow:var(--shadow)}.label{display:flex;align-items:center;gap:8px;color:#677287;font-size:12px;font-weight:800}.metric-icon{display:grid;place-items:center;width:23px;height:23px;border-radius:8px;color:var(--orange);background:var(--orange-soft);font-size:13px}.value{margin:16px 0 7px;font-size:25px;font-weight:850;letter-spacing:-.04em}.value small{font-size:15px}.small{color:var(--muted);font-size:12px;font-weight:650}.red{color:var(--red)}.memory-section{margin-top:16px;padding:22px;border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.9);box-shadow:var(--shadow)}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.section-head h2{margin:0;font-size:17px;letter-spacing:-.03em}.section-head span{color:var(--muted);font-size:12px;font-weight:650}.memory-list{display:grid}.memory-row{display:grid;grid-template-columns:28px minmax(0,1fr) auto 104px 34px;gap:12px;align-items:center;min-height:58px;border-top:1px solid #f0f1f4}.memory-row:first-child{border-top:0}.memory-row-icon{font-size:17px}.memory-name{font-size:14px;font-weight:800}.memory-tag{justify-self:start;padding:4px 9px;border:1px solid #f5dfcf;border-radius:999px;background:#fff8f3;color:#c96930;font-size:11px;font-weight:800}.memory-date{color:var(--muted);font-size:12px;font-weight:700}.memory-more{width:30px;height:30px;border-color:transparent;background:transparent}.memory-more:hover{background:#f7f8fa}.empty-memory{display:none;padding:32px;text-align:center;color:var(--muted)}@media(max-width:1366px){.main{padding:24px}.metrics{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:820px){.main{padding:20px 16px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.memory-row{grid-template-columns:26px minmax(0,1fr) auto 30px}.memory-date{display:none}}@media(max-width:480px){.metrics{grid-template-columns:1fr}.memory-row{gap:8px}.memory-tag{display:none}}
</style>
</head>
<body>
<div class="app">
  <gyuos-sidebar active="memory" card-title="Gyu Assistant" card-text="무엇이든 물어보세요."></gyuos-sidebar>
  <main class="main"><gyuos-header title="기억 검색" subtitle="저장된 기억과 맥락을 빠르게 찾아봅니다."></gyuos-header>
    <div class="memory-toolbar"><label class="memory-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="m16 16 4 4"></path></svg><input id="memorySearch" type="search" placeholder="기억하고 싶은 것을 검색해보세요..." aria-label="기억 검색"></label><button class="memory-refresh" id="memoryRefresh" type="button" aria-label="새로고침"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0 2 5"></path><path d="M20 4v7h-7"></path></svg></button></div>
    <section class="metrics"><article class="metric"><div class="label"><span class="metric-icon">▣</span>오늘 일정</div><div class="value">2 <small>건</small></div><div class="small">10:00 대표 미팅</div></article><article class="metric"><div class="label"><span class="metric-icon">₩</span>이번 달 소비</div><div class="value">452,600 <small>원</small></div><div class="small">지난 달 대비 <span class="red">+12%</span></div></article><article class="metric"><div class="label"><span class="metric-icon">⌁</span>차량 상태</div><div class="value">D-18</div><div class="small">보험 만기 예정</div></article><article class="metric"><div class="label"><span class="metric-icon">✓</span>루틴</div><div class="value">66<small>%</small></div><div class="small">목표 진행률</div></article><article class="metric"><div class="label"><span class="metric-icon">↗</span>콘텐츠</div><div class="value">2,340</div><div class="small">최근 7일 조회수</div></article></section>
    <section class="memory-section"><div class="section-head"><div><h2>최근 기억</h2><span>저장된 항목을 최신순으로 보여드립니다.</span></div></div><div class="memory-list" id="memoryList"><article class="memory-row" data-memory="제주도 여행 여행"><span class="memory-row-icon">⌂</span><strong class="memory-name">제주도 여행</strong><span class="memory-tag">여행</span><time class="memory-date">2024.04.18</time><button class="memory-more" type="button" aria-label="제주도 여행 더보기"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg></button></article><article class="memory-row" data-memory="강릉 카페 카페"><span class="memory-row-icon">◉</span><strong class="memory-name">강릉 카페</strong><span class="memory-tag">카페</span><time class="memory-date">2024.04.16</time><button class="memory-more" type="button" aria-label="강릉 카페 더보기"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg></button></article><article class="memory-row" data-memory="MacBook Air M3 구매"><span class="memory-row-icon">▰</span><strong class="memory-name">MacBook Air M3</strong><span class="memory-tag">구매</span><time class="memory-date">2024.04.10</time><button class="memory-more" type="button" aria-label="MacBook Air M3 더보기"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg></button></article></div><div class="empty-memory" id="memoryEmpty">일치하는 기억이 없습니다.</div></section>
  </main></div>
<script>document.getElementById("memoryRefresh").addEventListener("click",()=>window.location.reload());document.getElementById("memorySearch").addEventListener("input",event=>{const query=event.target.value.trim().toLowerCase();const rows=[...document.querySelectorAll("[data-memory]")];let count=0;rows.forEach(row=>{const match=row.dataset.memory.toLowerCase().includes(query);row.hidden=!match;if(match)count+=1});document.getElementById("memoryEmpty").style.display=count?"none":"block"})</script>
</body>
</html>
