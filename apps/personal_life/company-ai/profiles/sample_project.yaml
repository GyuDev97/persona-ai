id: sample-project
name: Sample Python Project
repo_path: ../sample_repo

stack:
  - python
  - unittest

build_command: python -m compileall -q .
test_command: python -m unittest discover -s tests -v
retry_limit: 3

rules:
  - Preserve the existing module and test structure.
  - Keep the implementation deliberately small and scoped to the requested behavior.
  - Add or update focused unit tests when changing behavior.
  - State any compatibility risk in the final summary.

protected_paths:
  - config/prod
  - deploy
  - .env
