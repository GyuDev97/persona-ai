<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>G.Y.U.V.I.S. Standby V2</title>
  <style>
    :root {
      --cyan: #2cdcff;
      --cyan-soft: rgba(44, 220, 255, 0.52);
      --cyan-dim: rgba(44, 220, 255, 0.16);
      --blue-line: rgba(95, 190, 255, 0.65);
      --green-core: #24d0a6;
      --bg: #02070f;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #00040a;
      color: #e8fbff;
      font-family: "Segoe UI", "Noto Sans KR", sans-serif;
      user-select: none;
    }

    body {
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 50%, rgba(0, 153, 206, 0.16), transparent 28%),
        linear-gradient(90deg, transparent 0 96%, rgba(74, 186, 255, 0.07) 96.2%, transparent 96.4%),
        linear-gradient(0deg, transparent 0 94%, rgba(74, 186, 255, 0.055) 94.2%, transparent 94.4%),
        #01050c;
      background-size: auto, 86px 86px, 86px 86px, auto;
    }

    #gestureVideo {
      position: fixed;
      right: 0;
      bottom: 0;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      transform: scaleX(-1);
    }

    #gestureCanvas {
      position: fixed;
      inset: 0;
      z-index: 60;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      background:
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.032) 0 1px, transparent 1px 5px),
        linear-gradient(90deg, rgba(0, 0, 0, 0.82), transparent 18%, transparent 82%, rgba(0, 0, 0, 0.82));
      opacity: 0.38;
      mix-blend-mode: screen;
    }

    body::after {
      background:
        linear-gradient(180deg, rgba(8, 22, 40, 0.24), transparent 24%, transparent 76%, rgba(8, 22, 40, 0.35)),
        radial-gradient(circle at 50% 50%, transparent 0 32%, rgba(0, 0, 0, 0.44) 78%);
    }

    .scene {
      position: relative;
      width: min(100vw, 1320px);
      height: min(100vh, 760px);
      min-height: 560px;
      isolation: isolate;
    }

    .scan {
      position: absolute;
      inset: -8%;
      background: linear-gradient(180deg, transparent 0 42%, rgba(44, 220, 255, 0.08) 50%, transparent 58%);
      animation: scanMove 5.6s linear infinite;
      opacity: 0.75;
      pointer-events: none;
    }

    .core-wrap {
      position: absolute;
      left: 50%;
      top: 48%;
      width: min(31vw, 355px);
      min-width: 250px;
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      display: grid;
      place-items: center;
      filter: drop-shadow(0 0 34px rgba(44, 220, 255, 0.32));
      animation: floatCore 6.5s ease-in-out infinite;
      z-index: 4;
    }

    .core {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0.9) 0 7%, rgba(0, 30, 42, 0.95) 8% 15%, rgba(35, 216, 174, 0.68) 16% 32%, transparent 33%),
        radial-gradient(circle, rgba(3, 45, 60, 0.8) 0 34%, transparent 35%),
        conic-gradient(from 90deg, transparent 0 16deg, rgba(44, 220, 255, 0.94) 16deg 92deg, transparent 92deg 136deg, rgba(44, 220, 255, 0.9) 136deg 220deg, transparent 220deg 360deg);
      box-shadow:
        inset 0 0 44px rgba(44, 220, 255, 0.26),
        inset 0 0 86px rgba(0, 0, 0, 0.55),
        0 0 68px rgba(44, 220, 255, 0.24);
      overflow: hidden;
    }

    .core::before,
    .core::after {
      content: "";
      position: absolute;
      inset: 7%;
      border-radius: 50%;
      border: 2px solid rgba(100, 220, 255, 0.58);
      border-left-color: transparent;
      border-bottom-color: rgba(100, 220, 255, 0.22);
      animation: rotate 11s linear infinite;
    }

    .core::after {
      inset: 21%;
      border-width: 1px;
      border-color: rgba(197, 249, 255, 0.55);
      border-top-color: transparent;
      border-right-color: transparent;
      animation-duration: 7s;
      animation-direction: reverse;
    }

    .core-pulse {
      position: absolute;
      inset: 34%;
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(40, 219, 178, 0.72), rgba(5, 80, 74, 0.34) 58%, rgba(0, 0, 0, 0.82));
      box-shadow: 0 0 35px rgba(36, 208, 166, 0.44);
      animation: pulse 2s ease-in-out infinite;
    }

    .ticks {
      position: absolute;
      inset: 25%;
      border-radius: 50%;
      background: repeating-conic-gradient(
        from 0deg,
        rgba(210, 255, 255, 0.66) 0 1deg,
        transparent 1deg 7deg
      );
      mask: radial-gradient(circle, transparent 0 74%, #000 75% 100%);
      opacity: 0.55;
      animation: rotate 18s linear infinite reverse;
    }

    .title {
      position: absolute;
      left: 48px;
      top: 42px;
      z-index: 6;
      display: grid;
      gap: 8px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      text-shadow: 0 0 18px rgba(44, 220, 255, 0.52);
    }

    .title strong {
      font-size: clamp(20px, 2.7vw, 34px);
      font-weight: 400;
    }

    .title span {
      color: rgba(197, 241, 255, 0.62);
      font-size: 12px;
    }

    .status {
      position: absolute;
      left: 50%;
      bottom: 58px;
      z-index: 7;
      transform: translateX(-50%);
      display: grid;
      gap: 10px;
      justify-items: center;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      text-align: center;
      color: rgba(237, 252, 255, 0.92);
      text-shadow: 0 0 18px rgba(44, 220, 255, 0.5);
    }

    .status-main {
      font-size: clamp(18px, 2.3vw, 29px);
    }

    .status-sub {
      font-size: 12px;
      color: rgba(205, 237, 248, 0.62);
      letter-spacing: 0.09em;
      text-transform: none;
    }

    .subtitles {
      width: min(860px, 88vw);
      display: grid;
      gap: 7px;
      margin-top: 2px;
      text-transform: none;
      letter-spacing: 0;
    }

    .subtitle-line {
      min-height: 24px;
      display: grid;
      grid-template-columns: 64px minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      padding: 6px 12px;
      border: 1px solid rgba(68, 195, 255, 0.18);
      background: linear-gradient(90deg, rgba(3, 16, 30, 0.1), rgba(7, 35, 55, 0.34), rgba(3, 16, 30, 0.1));
      color: rgba(226, 247, 255, 0.86);
      font-size: clamp(12px, 1.25vw, 15px);
      line-height: 1.45;
      text-align: left;
      box-shadow: inset 0 0 18px rgba(44, 220, 255, 0.04);
    }

    .subtitle-line span:first-child {
      color: rgba(92, 226, 255, 0.78);
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .subtitle-line span:last-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .subtitle-line.output span:first-child {
      color: rgba(111, 255, 221, 0.78);
    }

    .clock {
      position: absolute;
      right: 48px;
      top: 44px;
      z-index: 7;
      font-size: clamp(18px, 2.2vw, 30px);
      letter-spacing: 0.13em;
      font-variant-numeric: tabular-nums;
      color: rgba(236, 251, 255, 0.94);
      text-shadow: 0 0 17px rgba(44, 220, 255, 0.48);
    }

    .module {
      position: absolute;
      z-index: 3;
      color: var(--blue-line);
      filter: drop-shadow(0 0 8px rgba(44, 220, 255, 0.36));
      opacity: 0.86;
      animation: floatModule var(--duration, 7s) ease-in-out infinite;
      animation-delay: var(--delay, 0s);
    }

    .module svg {
      display: block;
      overflow: visible;
    }

    .module path,
    .module polyline,
    .module line,
    .module rect,
    .module circle {
      vector-effect: non-scaling-stroke;
    }

    .m-top {
      left: 34%;
      top: 4%;
      --duration: 8s;
    }

    .m-left {
      left: 3%;
      top: 25%;
      --duration: 6.7s;
      --delay: -1.4s;
    }

    .m-right {
      right: 1%;
      top: 31%;
      --duration: 7.4s;
      --delay: -2s;
    }

    .m-bottom-left {
      left: 0%;
      bottom: 15%;
      --duration: 8.6s;
      --delay: -3s;
    }

    .m-bottom-right {
      right: 0%;
      bottom: 10%;
      --duration: 7.8s;
      --delay: -1s;
    }

    .m-top-right {
      right: 18%;
      top: 5%;
      --duration: 6.5s;
      --delay: -2.6s;
    }

    .link {
      position: absolute;
      z-index: 2;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(83, 210, 255, 0.8), transparent);
      transform-origin: left center;
      opacity: 0.68;
      box-shadow: 0 0 12px rgba(44, 220, 255, 0.42);
      animation: linkPulse 2.8s ease-in-out infinite;
    }

    .l1 { left: 27%; top: 25%; width: 25%; transform: rotate(25deg); }
    .l2 { left: 18%; top: 49%; width: 31%; transform: rotate(-5deg); animation-delay: -0.8s; }
    .l3 { left: 52%; top: 33%; width: 28%; transform: rotate(-21deg); animation-delay: -1.1s; }
    .l4 { left: 51%; top: 55%; width: 34%; transform: rotate(12deg); animation-delay: -1.6s; }
    .l5 { left: 28%; top: 67%; width: 27%; transform: rotate(-24deg); animation-delay: -2s; }

    .data-strip {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 34px;
      background: repeating-linear-gradient(
        90deg,
        transparent 0 12px,
        rgba(44, 220, 255, 0.13) 12px 13px,
        transparent 13px 28px
      );
      opacity: 0.42;
      animation: drift 9s linear infinite;
    }

    .agent-card {
      position: absolute;
      z-index: 6;
      width: 280px;
      min-height: 104px;
      padding: 14px 16px;
      border: 1px solid rgba(88, 196, 255, 0.42);
      background:
        linear-gradient(135deg, rgba(4, 19, 32, 0.74), rgba(3, 10, 19, 0.48)),
        radial-gradient(circle at 18% 20%, rgba(44, 220, 255, 0.13), transparent 44%);
      box-shadow:
        inset 0 0 26px rgba(44, 220, 255, 0.07),
        0 0 22px rgba(44, 220, 255, 0.08);
      color: rgba(228, 249, 255, 0.9);
      clip-path: polygon(0 0, 92% 0, 100% 28%, 100% 100%, 8% 100%, 0 74%);
      transition:
        transform 1.35s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 900ms ease,
        border-color 900ms ease,
        box-shadow 900ms ease,
        filter 900ms ease;
      animation: cardBreathe var(--duration, 7s) ease-in-out infinite;
      animation-delay: var(--delay, 0s);
    }

    .agent-card.active-focus {
      border-color: rgba(76, 229, 255, 0.95);
      box-shadow:
        inset 0 0 34px rgba(44, 220, 255, 0.17),
        0 0 32px rgba(44, 220, 255, 0.4);
      transform: translate3d(0, -4px, 0);
    }

    .agent-card.presenting {
      z-index: 7;
      border-color: rgba(89, 235, 255, 0.98);
      background:
        linear-gradient(135deg, rgba(4, 26, 46, 0.94), rgba(2, 12, 26, 0.76)),
        radial-gradient(circle at 18% 20%, rgba(44, 220, 255, 0.24), transparent 48%);
      box-shadow:
        inset 0 0 42px rgba(44, 220, 255, 0.18),
        0 0 46px rgba(44, 220, 255, 0.55);
      animation: presentAgent 4.8s ease-in-out infinite;
    }

    .agent-card.grabbed {
      z-index: 20;
      cursor: grabbing;
      border-color: rgba(128, 255, 245, 1);
      box-shadow:
        inset 0 0 44px rgba(44, 220, 255, 0.22),
        0 0 58px rgba(44, 220, 255, 0.64);
      animation: none;
    }

    .agent-card.presenting.agent-slot-1 {
      transform: translate3d(0, -6px, 0) scale(1.02);
    }

    .agent-card.presenting.agent-slot-2 {
      transform: translate3d(0, -6px, 0) scale(1.02);
    }

    .agent-card.presenting.agent-slot-3 {
      transform: translate3d(0, -6px, 0) scale(1.02);
    }

    .agent-card.presenting.agent-slot-4 {
      transform: translate3d(0, -6px, 0) scale(1.02);
    }

    .agent-card[data-tone="active"] .agent-status {
      color: #57f3ff;
    }

    .agent-card[data-tone="idle"] .agent-status {
      color: #a8c8d6;
    }

    .agent-card[data-tone="error"] .agent-status {
      color: #ffb05f;
    }

    .agent-card h2 {
      margin: 0 0 10px;
      font-size: 12px;
      line-height: 1.45;
      letter-spacing: 0.08em;
      font-weight: 500;
    }

    .agent-id {
      margin-bottom: 7px;
      font-size: 11px;
      color: rgba(124, 219, 255, 0.74);
      letter-spacing: 0.18em;
    }

    .agent-meta {
      display: grid;
      gap: 4px;
      font-size: 12px;
      color: rgba(216, 241, 248, 0.7);
    }

    .agent-slot-1 {
      left: 7%;
      top: 34%;
      --duration: 7.2s;
      --delay: -0.6s;
    }

    .agent-slot-2 {
      left: 12%;
      bottom: 18%;
      --duration: 8.4s;
      --delay: -2.1s;
    }

    .agent-slot-3 {
      right: 8%;
      top: 36%;
      --duration: 7.7s;
      --delay: -1.2s;
    }

    .agent-slot-4 {
      right: 10%;
      bottom: 15%;
      --duration: 8.8s;
      --delay: -2.8s;
    }

    .agent-detail {
      position: absolute;
      z-index: 12;
      left: 50%;
      top: 44%;
      width: min(36vw, 540px);
      min-height: 128px;
      padding: 18px 22px;
      border: 1px solid rgba(46, 107, 255, 0.95);
      background:
        linear-gradient(90deg, rgba(4, 20, 44, 0.8), rgba(2, 8, 20, 0.28)),
        radial-gradient(circle at 12% 20%, rgba(44, 220, 255, 0.16), transparent 44%);
      box-shadow:
        0 0 30px rgba(23, 97, 255, 0.34),
        inset 0 0 22px rgba(44, 220, 255, 0.08);
      color: rgba(239, 253, 255, 0.96);
      transform: translate(-50%, -50%);
      clip-path: polygon(0 0, 98% 0, 100% 12%, 100% 92%, 96% 100%, 2% 100%, 0 88%);
      animation: detailBreathe 4.8s ease-in-out infinite;
    }

    .agent-detail-label {
      margin-bottom: 10px;
      color: rgba(100, 218, 255, 0.8);
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .agent-detail-title {
      margin: 0 0 14px;
      font-size: clamp(16px, 1.55vw, 22px);
      line-height: 1.35;
      font-weight: 500;
    }

    .agent-detail-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px 18px;
      color: rgba(219, 244, 250, 0.82);
      font-size: 14px;
    }

    .report-overlay {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: grid;
      place-items: center;
      padding: 5vw;
      opacity: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 45%, rgba(44, 220, 255, 0.18), transparent 34%),
        rgba(0, 4, 10, 0.72);
      backdrop-filter: blur(8px);
      transition: opacity 360ms ease;
    }

    .report-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .report-panel {
      width: min(900px, 88vw);
      min-height: min(560px, 76vh);
      padding: 34px 40px;
      border: 1px solid rgba(72, 220, 255, 0.86);
      background:
        linear-gradient(135deg, rgba(4, 22, 38, 0.92), rgba(1, 8, 18, 0.88)),
        radial-gradient(circle at 20% 14%, rgba(44, 220, 255, 0.16), transparent 38%);
      box-shadow:
        0 0 70px rgba(44, 220, 255, 0.34),
        inset 0 0 42px rgba(44, 220, 255, 0.08);
      clip-path: polygon(0 0, 96% 0, 100% 8%, 100% 100%, 4% 100%, 0 92%);
      transform: translateY(18px) scale(0.98);
      transition: transform 420ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .report-overlay.active .report-panel {
      transform: translateY(0) scale(1);
    }

    .report-kicker {
      color: rgba(92, 226, 255, 0.84);
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .report-title {
      margin: 0 0 20px;
      font-size: clamp(27px, 4vw, 46px);
      line-height: 1.18;
      font-weight: 600;
      text-shadow: 0 0 22px rgba(44, 220, 255, 0.28);
    }

    .report-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }

    .report-stat {
      border: 1px solid rgba(82, 184, 255, 0.34);
      padding: 14px 16px;
      background: rgba(3, 16, 30, 0.56);
      color: rgba(225, 249, 255, 0.9);
    }

    .report-stat span {
      display: block;
      color: rgba(150, 221, 244, 0.68);
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .report-body {
      display: grid;
      gap: 12px;
      color: rgba(224, 243, 249, 0.86);
      font-size: 16px;
      line-height: 1.65;
    }

    .report-close {
      position: absolute;
      right: 34px;
      top: 28px;
      border: 1px solid rgba(109, 223, 255, 0.44);
      background: rgba(3, 16, 30, 0.6);
      color: rgba(231, 252, 255, 0.9);
      padding: 8px 12px;
      cursor: pointer;
      letter-spacing: 0.08em;
    }

    @keyframes rotate {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(0.92); opacity: 0.72; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    @keyframes floatCore {
      0%, 100% { transform: translate(-50%, -50%) translate3d(0, -8px, 0); }
      50% { transform: translate(-50%, -50%) translate3d(0, 12px, 0); }
    }

    @keyframes floatModule {
      0%, 100% { transform: translate3d(0, 0, 0); }
      33% { transform: translate3d(10px, -12px, 0); }
      66% { transform: translate3d(-8px, 8px, 0); }
    }

    @keyframes linkPulse {
      0%, 100% { opacity: 0.3; filter: brightness(0.8); }
      50% { opacity: 0.95; filter: brightness(1.25); }
    }

    @keyframes scanMove {
      from { transform: translateY(-55%); }
      to { transform: translateY(55%); }
    }

    @keyframes drift {
      to { background-position-x: 220px; }
    }

    @keyframes presentAgent {
      0%, 100% { filter: brightness(0.96); }
      45%, 58% { filter: brightness(1.32); }
    }

    @keyframes cardBreathe {
      0%, 100% {
        filter: brightness(0.88);
        opacity: 0.74;
      }
      50% {
        filter: brightness(1.06);
        opacity: 0.92;
      }
    }

    @keyframes detailBreathe {
      0%, 100% {
        box-shadow:
          0 0 24px rgba(23, 97, 255, 0.24),
          inset 0 0 22px rgba(44, 220, 255, 0.08);
      }
      50% {
        box-shadow:
          0 0 46px rgba(23, 97, 255, 0.44),
          inset 0 0 30px rgba(44, 220, 255, 0.16);
      }
    }

    @media (max-width: 780px) {
      .scene {
        min-height: 100vh;
      }

      .title {
        left: 24px;
        top: 26px;
      }

      .clock {
        right: 24px;
        top: 28px;
      }

      .core-wrap {
        min-width: 230px;
      }

      .module {
        opacity: 0.52;
        transform: scale(0.72);
      }

      .m-left,
      .m-right {
        display: none;
      }

      .status {
        width: 92vw;
        bottom: 42px;
      }

      .agent-card {
        width: 210px;
        opacity: 0.78;
        transform: scale(0.82);
      }

      .agent-card.presenting.agent-slot-1,
      .agent-card.presenting.agent-slot-2,
      .agent-card.presenting.agent-slot-3,
      .agent-card.presenting.agent-slot-4 {
        transform: translate3d(0, 0, 0) scale(0.96);
      }

      .agent-slot-1 { left: 2%; top: 26%; }
      .agent-slot-2 { left: 2%; bottom: 16%; }
      .agent-slot-3 { right: 2%; top: 26%; }
      .agent-slot-4 { right: 2%; bottom: 16%; }

      .agent-detail {
        left: 50%;
        top: 61%;
        width: 88vw;
        transform: translate(-50%, -50%);
      }
    }
  </style>
</head>
<body>
  <video id="gestureVideo" autoplay playsinline muted></video>
  <canvas id="gestureCanvas"></canvas>
  <main class="scene" aria-live="polite">
    <div class="scan"></div>

    <header class="title">
      <strong>G.Y.U.V.I.S.</strong>
      <span>standby interface v2</span>
    </header>

    <div class="clock" id="clock">00:00:00</div>

    <div class="link l1"></div>
    <div class="link l2"></div>
    <div class="link l3"></div>
    <div class="link l4"></div>
    <div class="link l5"></div>

    <section class="core-wrap" aria-label="GYUVIS core">
      <div class="core">
        <div class="ticks"></div>
        <div class="core-pulse"></div>
      </div>
    </section>

    <section class="agent-detail" id="agentDetail" aria-label="현재 브리핑 에이전트">
      <div class="agent-detail-label">Agent Detail</div>
      <h2 class="agent-detail-title" id="agentDetailTitle">에이전트 상태를 동기화 중입니다.</h2>
      <div class="agent-detail-grid">
        <div>상태 : <span id="agentDetailStatus">대기</span></div>
        <div>처리 : <span id="agentDetailProcessing">대기중</span></div>
      </div>
    </section>

    <div class="module m-top">
      <svg width="420" height="130" viewBox="0 0 420 130" fill="none">
        <path d="M2 98H92L128 58H184L206 28H310L338 45H418" stroke="currentColor" stroke-width="2"/>
        <path d="M102 90H158L180 70H252L268 53H333" stroke="currentColor" stroke-width="1.3" opacity=".7"/>
        <rect x="300" y="30" width="92" height="32" stroke="currentColor" stroke-width="1.5"/>
        <line x1="310" y1="39" x2="382" y2="39" stroke="currentColor"/>
        <line x1="310" y1="47" x2="382" y2="47" stroke="currentColor" opacity=".7"/>
        <circle cx="2" cy="98" r="3" fill="currentColor"/>
        <circle cx="184" cy="58" r="3" fill="currentColor"/>
      </svg>
    </div>

    <div class="module m-left">
      <svg width="350" height="180" viewBox="0 0 350 180" fill="none">
        <path d="M0 96H88L112 78H168L196 104H350" stroke="currentColor" stroke-width="2"/>
        <path d="M66 58H128L145 42H210" stroke="currentColor" stroke-width="1.4" opacity=".75"/>
        <rect x="110" y="92" width="72" height="26" stroke="currentColor"/>
        <circle cx="216" cy="104" r="8" stroke="currentColor" stroke-width="1.5"/>
        <circle cx="216" cy="104" r="3" fill="currentColor"/>
        <path d="M84 134H156L172 151H242" stroke="currentColor" opacity=".65"/>
      </svg>
    </div>

    <div class="module m-right">
      <svg width="370" height="200" viewBox="0 0 370 200" fill="none">
        <path d="M0 74H88L118 102H184L214 72H370" stroke="currentColor" stroke-width="2"/>
        <path d="M178 42H250L276 22H340" stroke="currentColor" opacity=".75"/>
        <path d="M214 120H304L322 140H368" stroke="currentColor" opacity=".65"/>
        <rect x="244" y="50" width="84" height="20" stroke="currentColor"/>
        <rect x="276" y="92" width="64" height="18" stroke="currentColor" opacity=".7"/>
        <circle cx="118" cy="102" r="4" fill="currentColor"/>
      </svg>
    </div>

    <div class="module m-bottom-left">
      <svg width="470" height="160" viewBox="0 0 470 160" fill="none">
        <path d="M0 128H150L178 94H240L260 70H330L358 92H470" stroke="currentColor" stroke-width="2"/>
        <path d="M74 92H136L152 74H205" stroke="currentColor" opacity=".7"/>

        <rect x="224" y="48" width="92" height="28" stroke="currentColor"/>
        <line x1="234" y1="57" x2="304" y2="57" stroke="currentColor"/>
        <circle cx="358" cy="92" r="5" stroke="currentColor"/>
      </svg>
    </div>

    <div class="module m-bottom-right">
      <svg width="500" height="170" viewBox="0 0 500 170" fill="none">
        <path d="M0 50H136L164 84H240L270 116H500" stroke="currentColor" stroke-width="2"/>
        <path d="M236 42H328L350 22H424" stroke="currentColor" opacity=".75"/>
        <path d="M270 116V148H330L348 162H500" stroke="currentColor" opacity=".65"/>
        <rect x="330" y="28" width="90" height="22" stroke="currentColor"/>
        <rect x="360" y="82" width="78" height="24" stroke="currentColor" opacity=".75"/>
        <circle cx="164" cy="84" r="4" fill="currentColor"/>
      </svg>
    </div>

    <div class="module m-top-right">
      <svg width="250" height="120" viewBox="0 0 250 120" fill="none">
        <path d="M0 72H70L92 42H148L174 20H250" stroke="currentColor" stroke-width="1.8"/>
        <path d="M88 88H148L170 104H222" stroke="currentColor" opacity=".65"/>
        <rect x="110" y="30" width="68" height="22" stroke="currentColor"/>
        <circle cx="92" cy="42" r="4" fill="currentColor"/>
      </svg>
    </div>

    <section class="status">
      <div class="status-main">Listening...</div>
      <div class="status-sub" id="statusSub">Awaiting your command, boss.</div>
      <div class="subtitles" aria-label="음성 자막">
        <div class="subtitle-line input"><span>INPUT</span><span id="subtitleInput">...</span></div>
        <div class="subtitle-line output"><span>GYUVIS</span><span id="subtitleOutput">...</span></div>
      </div>
    </section>

    <section aria-label="에이전트 슬롯">
      <article class="agent-card agent-slot-1" id="agentCard1"></article>
      <article class="agent-card agent-slot-2" id="agentCard2"></article>
      <article class="agent-card agent-slot-3" id="agentCard3"></article>
      <article class="agent-card agent-slot-4" id="agentCard4"></article>
    </section>

    <div class="data-strip"></div>
  </main>

  <section class="report-overlay" id="reportOverlay" aria-live="polite">
    <article class="report-panel">
      <button class="report-close" id="reportClose" type="button">CLOSE</button>
      <div class="report-kicker" id="reportKicker">Agent Report</div>
      <h2 class="report-title" id="reportTitle">에이전트 리포트</h2>
      <div class="report-grid">
        <div class="report-stat"><span>상태</span><strong id="reportStatus">대기</strong></div>
        <div class="report-stat"><span>처리</span><strong id="reportProcessing">대기중</strong></div>
      </div>
      <div class="report-body" id="reportBody"></div>
    </article>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script>
    const clockEl = document.getElementById("clock");
    const statusSubEl = document.getElementById("statusSub");
    const gestureVideo = document.getElementById("gestureVideo");
    const gestureCanvas = document.getElementById("gestureCanvas");
    const gestureCtx = gestureCanvas.getContext("2d");
    const reportOverlay = document.getElementById("reportOverlay");
    const reportClose = document.getElementById("reportClose");
    const reportKicker = document.getElementById("reportKicker");
    const reportTitle = document.getElementById("reportTitle");
    const reportStatus = document.getElementById("reportStatus");
    const reportProcessing = document.getElementById("reportProcessing");
    const reportBody = document.getElementById("reportBody");
    const subtitleInputEl = document.getElementById("subtitleInput");
    const subtitleOutputEl = document.getElementById("subtitleOutput");
    const agentDetailEl = document.getElementById("agentDetail");
    const agentDetailTitleEl = document.getElementById("agentDetailTitle");
    const agentDetailStatusEl = document.getElementById("agentDetailStatus");
    const agentDetailProcessingEl = document.getElementById("agentDetailProcessing");
    const agentCards = new Map([
      [1, document.getElementById("agentCard1")],
      [2, document.getElementById("agentCard2")],
      [3, document.getElementById("agentCard3")],
      [4, document.getElementById("agentCard4")]
    ]);
    let agentsCache = [];
    let presentingIndex = 0;
    let serverActiveAgentId = null;
    let lastDetailRequestedAt = null;
    let lastSpreadAt = 0;
    let gestureCanvasW = innerWidth;
    let gestureCanvasH = innerHeight;
    const handConnections = [
      [0, 1], [1, 2], [2, 3], [3, 4],
      [0, 5], [5, 6], [6, 7], [7, 8],
      [5, 9], [9, 10], [10, 11], [11, 12],
      [9, 13], [13, 14], [14, 15], [15, 16],
      [13, 17], [17, 18], [18, 19], [19, 20],
      [0, 17]
    ];
    const fingertipIndexes = new Set([4, 8, 12, 16, 20]);
    const agentReports = {
      1: [
        "오전 10시부터 오후 6시까지의 IT/모바일/테크 뉴스 흐름을 요약하는 전담 에이전트입니다.",
        "현재 단계에서는 Google News RSS 기준 최신 헤드라인을 수집하고, 보스께서 훑기 쉬운 목록으로 정리합니다.",
        "다음 단계: 시간대별 누적 수집, 중복 제거, 중요도 점수화를 붙이면 진짜 10시~18시 리포트로 확장할 수 있습니다."
      ],
      2: [
        "IT/모바일 블로그 초안 후보를 정리하고, 독자가 관심 가질 만한 제목 방향을 우선 추렸습니다.",
        "제품 비교, 업데이트 해설, 사용성 관점의 글감으로 나눠 초안 구조를 만들 수 있는 상태입니다.",
        "다음 단계: 선택한 주제에 맞춰 도입부와 목차를 작성할 수 있습니다."
      ],
      3: [
        "고급유 노트 앱 업데이트 항목을 대기열에 올려두었습니다.",
        "현재는 실행 전 상태이며, 변경 범위와 우선순위 확인이 필요합니다.",
        "다음 단계: 업데이트 대상 화면과 기능을 지정하면 작업을 시작할 수 있습니다."
      ],
      4: [
        "유튜브 아이디어 탐색 에이전트는 서버 오류를 확인 중입니다.",
        "현재 자동 수집 단계가 안정적으로 완료되지 않아, 연결 상태와 검색 API 응답을 점검하고 있습니다.",
        "다음 단계: 오류가 해소되면 후보 아이디어를 카테고리별로 재정리하겠습니다."
      ]
    };

    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, "0");
      const m = String(now.getMinutes()).padStart(2, "0");
      const s = String(now.getSeconds()).padStart(2, "0");
      clockEl.textContent = `${h}:${m}:${s}`;
    }

    function readQueryStatus() {
      const params = new URLSearchParams(location.search);
      const message = params.get("message");
      if (message) statusSubEl.textContent = message;
    }

    function getPresentedAgent() {
      if (serverActiveAgentId) {
        return agentsCache.find((agent) => agent.id === serverActiveAgentId) || null;
      }
      return agentsCache[presentingIndex % Math.max(agentsCache.length, 1)] || null;
    }

    function renderAgentCard(agent, presentedAgent) {
      const card = agentCards.get(agent.id);
      if (!card) return;
      const isPresented = presentedAgent && agent.id === presentedAgent.id;
      card.dataset.tone = agent.tone || "idle";
      card.classList.toggle("active-focus", isPresented);
      card.classList.toggle("presenting", isPresented);
      card.innerHTML = `
        <div class="agent-id">AGENT ${String(agent.id).padStart(2, "0")}</div>
        <h2>${agent.title}</h2>
        <div class="agent-meta">
          <div>상태 : <span class="agent-status">${agent.status}</span></div>
          <div>처리 : ${agent.processing}</div>
        </div>
      `;
    }

    function renderAgentDetail(agent) {
      if (!agent) {
        agentDetailTitleEl.textContent = "에이전트 상태를 대기 중입니다.";
        agentDetailStatusEl.textContent = "대기";
        agentDetailProcessingEl.textContent = "대기중";
        return;
      }

      agentDetailTitleEl.textContent = `#${agent.id} ${agent.title}`;
      agentDetailStatusEl.textContent = agent.status;
      agentDetailProcessingEl.textContent = agent.processing;
    }

    function showReport(agent) {
      if (!agent) return;
      reportKicker.textContent = `Agent ${String(agent.id).padStart(2, "0")} Expanded Report`;
      reportTitle.textContent = agent.title;
      reportStatus.textContent = agent.status;
      reportProcessing.textContent = agent.processing;
      reportBody.innerHTML = getAgentReportLines(agent)
        .map((line) => `<p>${line}</p>`)
        .join("");
      reportOverlay.classList.add("active");
      renderAgentDetail(agent);
    }

    function getAgentReportLines(agent) {
      if (agent.report?.summary) {
        const highlights = agent.report.highlights || [];
        const lines = [agent.report.summary];
        highlights.slice(0, 5).forEach((item, index) => {
          lines.push(`${index + 1}. ${item.title}`);
        });
        return lines;
      }

      if (agent.id === 1 && agent.latest_titles?.length) {
        return [
          `오늘 수집된 IT 뉴스는 ${agent.collected_count || agent.latest_titles.length}건입니다.`,
          ...agent.latest_titles.slice(0, 5).map((title, index) => `${index + 1}. ${title}`)
        ];
      }

      if (agent.id === 2 && agent.draft) {
        return [
          `최신 초안 #${agent.draft.id}: ${agent.draft.title}`,
          `상태: ${agent.draft.status || "drafted"}`,
          agent.draft.body_preview || "초안 본문 미리보기가 아직 준비되지 않았습니다."
        ];
      }

      if (agent.tasks?.length) {
        const lines = [
          `최근 작업 ${agent.tasks.length}건을 확인했습니다.`,
          ...agent.tasks.slice(0, 5).map((task) => {
            const result = task.error_message || task.result_summary || task.command_text || "작업 상세 없음";
            return `#${task.id} [${task.status}] ${result}`;
          })
        ];
        return lines;
      }

      return agentReports[agent.id] || ["수행 내용이 아직 등록되지 않았습니다."];
    }

    function hideReport() {
      reportOverlay.classList.remove("active");
    }

    function isNearCloseButton(point) {
      if (!reportOverlay.classList.contains("active")) return false;
      const rect = reportClose.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      return Math.hypot(point.x - cx, point.y - cy) < 120;
    }

    function isNearAgentDetail(point) {
      const rect = agentDetailEl.getBoundingClientRect();
      const padding = 220;
      return (
        point.x >= rect.left - padding &&
        point.x <= rect.right + padding &&
        point.y >= rect.top - padding &&
        point.y <= rect.bottom + padding
      );
    }

    async function refreshAgents() {
      try {
        const response = await fetch("http://127.0.0.1:8000/agent/standby-status", { cache: "no-store" });
        if (!response.ok) throw new Error("agent status failed");
        const state = await response.json();
        const agents = state.agents || [];
        agentsCache = agents;
        serverActiveAgentId = state.active_agent_id;
        const presentedAgent = getPresentedAgent();
        agents.forEach((agent) => renderAgentCard(agent, presentedAgent));
        renderAgentDetail(presentedAgent);
        if (state.detail_agent_id && state.detail_requested_at && state.detail_requested_at !== lastDetailRequestedAt) {
          const detailAgent = agents.find((agent) => agent.id === state.detail_agent_id);
          lastDetailRequestedAt = state.detail_requested_at;
          showReport(detailAgent);
        } else if (!state.detail_agent_id) {
          lastDetailRequestedAt = null;
        }
      } catch {
        statusSubEl.textContent = "Agent telemetry offline. Retrying...";
      }
    }

    async function refreshSubtitles() {
      try {
        const response = await fetch("http://127.0.0.1:8000/assistant/subtitles", { cache: "no-store" });
        if (!response.ok) throw new Error("subtitle status failed");
        const state = await response.json();
        subtitleInputEl.textContent = state.input || "...";
        subtitleOutputEl.textContent = state.output || "...";
      } catch {
        subtitleInputEl.textContent = "...";
        subtitleOutputEl.textContent = "Subtitle link offline.";
      }
    }

    function advancePresentedAgent() {
      if (!serverActiveAgentId && agentsCache.length) {
        presentingIndex = (presentingIndex + 1) % agentsCache.length;
        const presentedAgent = getPresentedAgent();
        agentsCache.forEach((agent) => renderAgentCard(agent, presentedAgent));
        renderAgentDetail(presentedAgent);
      }
    }

    function pointToScreen(point) {
      return {
        x: (1 - point.x) * innerWidth,
        y: point.y * innerHeight
      };
    }

    function resizeGestureCanvas() {
      gestureCanvasW = innerWidth;
      gestureCanvasH = innerHeight;
      const dpr = window.devicePixelRatio || 1;
      gestureCanvas.width = Math.round(gestureCanvasW * dpr);
      gestureCanvas.height = Math.round(gestureCanvasH * dpr);
      gestureCanvas.style.width = `${gestureCanvasW}px`;
      gestureCanvas.style.height = `${gestureCanvasH}px`;
      gestureCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function isPinching(hand) {
      const thumb = hand[4];
      const index = hand[8];
      return Math.hypot(thumb.x - index.x, thumb.y - index.y) < 0.055;
    }

    function drawGestureHands(hands) {
      gestureCtx.clearRect(0, 0, gestureCanvasW, gestureCanvasH);
      if (!hands.length) return;

      hands.forEach((hand) => {
        const points = hand.map(pointToScreen);
        const pinching = isPinching(hand);

        gestureCtx.save();
        gestureCtx.lineCap = "round";
        gestureCtx.lineJoin = "round";
        gestureCtx.shadowColor = pinching ? "rgba(116, 255, 225, 0.95)" : "rgba(44, 220, 255, 0.75)";
        gestureCtx.shadowBlur = pinching ? 16 : 10;

        handConnections.forEach(([start, end]) => {
          const a = points[start];
          const b = points[end];
          gestureCtx.beginPath();
          gestureCtx.moveTo(a.x, a.y);
          gestureCtx.lineTo(b.x, b.y);
          gestureCtx.strokeStyle = pinching ? "rgba(132, 255, 228, 0.82)" : "rgba(85, 210, 255, 0.62)";
          gestureCtx.lineWidth = fingertipIndexes.has(end) ? 3 : 2;
          gestureCtx.stroke();
        });

        points.forEach((point, index) => {
          const isTip = fingertipIndexes.has(index);
          gestureCtx.beginPath();
          gestureCtx.arc(point.x, point.y, isTip ? 6 : 3.2, 0, Math.PI * 2);
          gestureCtx.fillStyle = isTip ? "rgba(232, 255, 255, 0.92)" : "rgba(58, 219, 255, 0.68)";
          gestureCtx.fill();
        });

        const thumb = points[4];
        const index = points[8];
        gestureCtx.beginPath();
        gestureCtx.moveTo(thumb.x, thumb.y);
        gestureCtx.lineTo(index.x, index.y);
        gestureCtx.strokeStyle = pinching ? "rgba(255, 255, 255, 0.95)" : "rgba(115, 221, 255, 0.28)";
        gestureCtx.lineWidth = pinching ? 4 : 1.5;
        gestureCtx.stroke();

        if (pinching) {
          const cx = (thumb.x + index.x) / 2;
          const cy = (thumb.y + index.y) / 2;
          gestureCtx.beginPath();
          gestureCtx.arc(cx, cy, 18, 0, Math.PI * 2);
          gestureCtx.strokeStyle = "rgba(132, 255, 228, 0.85)";
          gestureCtx.lineWidth = 2;
          gestureCtx.stroke();
          gestureCtx.font = "12px Segoe UI";
          gestureCtx.fillStyle = "rgba(232, 255, 255, 0.9)";
          gestureCtx.fillText("PINCH", cx + 22, cy + 4);
        }

        gestureCtx.restore();
      });
    }

    function handleGestureResults(results) {
      const hands = results.multiHandLandmarks || [];
      drawGestureHands(hands);
      if (!hands.length) {
        return;
      }

      const primary = hands[0];
      const primaryPoint = pointToScreen(primary[8]);
      if (isPinching(primary)) {
        if (isNearCloseButton(primaryPoint)) {
          hideReport();
          return;
        }
      }

      if (hands.length >= 2) {
        const p1 = pointToScreen(hands[0][8]);
        const p2 = pointToScreen(hands[1][8]);
        const midpoint = {
          x: (p1.x + p2.x) / 2,
          y: (p1.y + p2.y) / 2
        };
        const spread = Math.hypot(p1.x - p2.x, p1.y - p2.y) / Math.min(innerWidth, innerHeight);
        const now = performance.now();
        if (spread > 0.38 && isNearAgentDetail(midpoint) && now - lastSpreadAt > 1600) {
          lastSpreadAt = now;
          const agent = getPresentedAgent();
          showReport(agent);
        }
      }
    }

    function setupGestures() {
      if (!window.Hands || !window.Camera) {
        statusSubEl.textContent = "Gesture module unavailable. Agent telemetry remains active.";
        return;
      }

      const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });
      hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 1,
        minDetectionConfidence: 0.64,
        minTrackingConfidence: 0.62
      });
      hands.onResults(handleGestureResults);

      const camera = new Camera(gestureVideo, {
        onFrame: async () => {
          await hands.send({ image: gestureVideo });
        },
        width: 960,
        height: 540
      });

      camera.start()
        .then(() => {
          statusSubEl.textContent = "Gesture control online. Spread both hands near the center to expand.";
        })
        .catch(() => {
          statusSubEl.textContent = "Camera permission needed for gesture control.";
        });
    }

    updateClock();
    resizeGestureCanvas();
    readQueryStatus();
    refreshAgents();
    refreshSubtitles();
    setupGestures();
    setInterval(updateClock, 1000);
    setInterval(refreshAgents, 1200);
    setInterval(refreshSubtitles, 650);
    setInterval(advancePresentedAgent, 4800);
    reportClose.addEventListener("click", hideReport);
    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape") hideReport();
    });
    window.addEventListener("resize", resizeGestureCanvas);
  </script>
</body>
