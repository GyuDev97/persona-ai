<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>G.Y.U.V.I.S. Standby</title>
  <style>
    :root {
      --cyan: #27d7ff;
      --cyan-soft: rgba(39, 215, 255, 0.46);
      --cyan-dim: rgba(39, 215, 255, 0.16);
      --white: #f3fbff;
      --bg: #07111f;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #040912;
      color: var(--white);
      font-family: "Segoe UI", "Noto Sans KR", sans-serif;
      user-select: none;
    }

    body {
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 48%, rgba(31, 156, 202, 0.2), transparent 32%),
        linear-gradient(rgba(83, 179, 224, 0.09) 1px, transparent 1px),
        linear-gradient(90deg, rgba(83, 179, 224, 0.09) 1px, transparent 1px),
        linear-gradient(135deg, #0a1728 0%, #050a14 58%, #03070d 100%);
      background-size: auto, 70px 70px, 70px 70px, auto;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      background:
        radial-gradient(circle at 50% 47%, transparent 0 18%, rgba(39, 215, 255, 0.08) 18.2%, transparent 18.7%),
        radial-gradient(circle at 50% 47%, transparent 0 27%, rgba(39, 215, 255, 0.07) 27.2%, transparent 27.5%),
        linear-gradient(90deg, transparent 0 48%, rgba(123, 224, 255, 0.07) 48.1% 48.25%, transparent 48.35%),
        linear-gradient(0deg, transparent 0 48%, rgba(123, 224, 255, 0.06) 48.1% 48.25%, transparent 48.35%);
      opacity: 0.8;
    }

    body::after {
      background: repeating-linear-gradient(
        0deg,
        rgba(255, 255, 255, 0.035) 0 1px,
        transparent 1px 5px
      );
      mix-blend-mode: screen;
      opacity: 0.18;
    }

    .hud {
      position: relative;
      width: min(94vw, 1180px);
      min-height: min(72vh, 680px);
      display: grid;
      grid-template-rows: 128px 1fr 112px;
      padding: 48px 56px;
    }

    .corner {
      position: fixed;
      width: 170px;
      height: 72px;
      opacity: 0.85;
    }

    .corner::before,
    .corner::after {
      content: "";
      position: absolute;
      background: rgba(186, 239, 255, 0.8);
      box-shadow: 0 0 12px rgba(83, 223, 255, 0.55);
    }

    .corner::before {
      top: 35px;
      left: 0;
      right: 28px;
      height: 1px;
    }

    .corner::after {
      top: 32px;
      right: 22px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    .corner span {
      position: absolute;
      top: 22px;
      right: 0;
      width: 42px;
      height: 28px;
      border-top: 1px solid rgba(186, 239, 255, 0.76);
      border-right: 1px solid rgba(186, 239, 255, 0.76);
      transform: skewX(-28deg);
    }

    .corner.tl { left: 54px; top: 42px; }
    .corner.tr { right: 54px; top: 42px; transform: scaleX(-1); }
    .corner.bl { left: 54px; bottom: 42px; transform: scaleY(-1); }
    .corner.br { right: 54px; bottom: 42px; transform: scale(-1); }

    .title-frame {
      align-self: start;
      justify-self: start;
      position: relative;
      min-width: min(560px, 70vw);
      height: 92px;
      display: grid;
      align-items: center;
      padding-left: 88px;
      color: rgba(242, 253, 255, 0.95);
    }

    .title-frame::before {
      content: "";
      position: absolute;
      inset: 18px 0 10px 0;
      border: 1px solid rgba(147, 228, 255, 0.62);
      clip-path: polygon(8% 0, 100% 0, 100% 66%, 93% 100%, 0 100%, 0 34%);
      box-shadow: inset 0 0 26px rgba(39, 215, 255, 0.07), 0 0 22px rgba(39, 215, 255, 0.08);
    }

    .title-frame::after {
      content: "";
      position: absolute;
      left: 18px;
      top: 55px;
      width: 58px;
      height: 1px;
      background: rgba(147, 228, 255, 0.7);
      box-shadow: 0 0 12px var(--cyan);
    }

    .title {
      position: relative;
      z-index: 1;
      margin: 0;
      font-size: clamp(24px, 4vw, 43px);
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-shadow: 0 0 18px rgba(151, 238, 255, 0.54);
    }

    .main {
      align-self: center;
      justify-self: center;
      position: relative;
      width: min(780px, 86vw);
      height: 300px;
      display: grid;
      place-items: center;
    }

    .hex-field {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 0 26px rgba(30, 206, 255, 0.3));
    }

    .hex {
      width: 96px;
      height: 108px;
      margin-left: -12px;
      display: grid;
      place-items: center;
      clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0 50%);
      background: linear-gradient(145deg, rgba(19, 180, 220, 0.9), rgba(6, 86, 123, 0.6));
      border: 1px solid rgba(179, 244, 255, 0.35);
      box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.08);
      opacity: 0.86;
    }

    .hex:nth-child(1),
    .hex:nth-child(2) {
      transform: translateY(46px);
      opacity: 0.52;
    }

    .hex:nth-child(4),
    .hex:nth-child(6),
    .hex:nth-child(8) {
      transform: translateY(-28px);
      background: linear-gradient(145deg, rgba(34, 206, 245, 0.88), rgba(8, 122, 165, 0.7));
    }

    .hex:nth-child(9) {
      transform: translateY(36px);
      opacity: 0.62;
    }

    .hex-icon {
      width: 84px;
      height: 94px;
      background: rgba(248, 253, 255, 0.98);
      color: #148ab0;
      font-size: 31px;
      font-weight: 600;
    }

    .time-panel {
      position: relative;
      z-index: 3;
      display: grid;
      grid-template-columns: auto auto;
      align-items: center;
      gap: 26px;
      padding: 26px 28px 12px;
      text-align: center;
    }

    .clock {
      font-size: clamp(76px, 14vw, 150px);
      line-height: 0.88;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #ffffff;
      text-shadow:
        0 0 6px rgba(255, 255, 255, 0.55),
        0 0 28px rgba(35, 206, 255, 0.45);
      font-variant-numeric: tabular-nums;
    }

    .side {
      display: grid;
      gap: 12px;
      align-content: center;
      justify-items: center;
    }

    .temperature {
      width: 122px;
      height: 112px;
      clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0 50%);
      display: grid;
      place-items: center;
      background: rgba(248, 253, 255, 0.98);
      color: #1286ad;
      font-size: 39px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      box-shadow: 0 0 28px rgba(70, 227, 255, 0.3);
    }

    .weather-icon {
      position: relative;
      width: 90px;
      height: 82px;
      clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0 50%);
      background: rgba(248, 253, 255, 0.98);
    }

    .weather-icon::before {
      content: "";
      position: absolute;
      left: 22px;
      top: 30px;
      width: 46px;
      height: 24px;
      border: 8px solid #138ab0;
      border-bottom: 0;
      border-radius: 60px 60px 0 0;
    }

    .weather-icon::after {
      content: "";
      position: absolute;
      left: 19px;
      top: 48px;
      width: 52px;
      height: 8px;
      border-radius: 999px;
      background: #138ab0;
    }

    .date-row {
      position: absolute;
      left: 50%;
      bottom: 40px;
      transform: translateX(-50%);
      display: flex;
      gap: 24px;
      align-items: center;
      justify-content: center;
      font-size: clamp(22px, 3.4vw, 39px);
      line-height: 1;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #f7fcff;
      text-shadow: 0 0 16px rgba(151, 238, 255, 0.48);
      white-space: nowrap;
    }

    .status {
      align-self: end;
      justify-self: center;
      display: grid;
      gap: 12px;
      justify-items: center;
      color: rgba(223, 249, 255, 0.88);
    }

    .status-main {
      font-size: clamp(18px, 2.4vw, 28px);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      text-shadow: 0 0 15px rgba(39, 215, 255, 0.58);
    }

    .status-sub {
      min-height: 22px;
      font-size: 14px;
      color: rgba(205, 239, 249, 0.72);
      letter-spacing: 0.08em;
    }

    .pulse-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 20px var(--cyan), 0 0 42px rgba(39, 215, 255, 0.48);
      animation: pulse 1.2s ease-in-out infinite;
    }

    .micro-lines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.26;
      background:
        linear-gradient(115deg, transparent 22%, rgba(39, 215, 255, 0.1) 22.15%, transparent 22.35%),
        linear-gradient(15deg, transparent 68%, rgba(39, 215, 255, 0.08) 68.15%, transparent 68.35%);
    }

    @keyframes pulse {
      0%, 100% { transform: scale(0.72); opacity: 0.6; }
      50% { transform: scale(1.12); opacity: 1; }
    }

    @media (max-width: 780px) {
      .hud {
        grid-template-rows: 116px 1fr 112px;
        padding: 32px 22px;
      }

      .title-frame {
        min-width: 100%;
        padding-left: 44px;
      }

      .main {
        width: 96vw;
        transform: scale(0.86);
      }

      .time-panel {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .side {
        grid-template-columns: auto auto;
      }

      .date-row {
        bottom: 10px;
        font-size: 22px;
      }

      .corner {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="micro-lines"></div>
  <div class="corner tl"><span></span></div>
  <div class="corner tr"><span></span></div>
  <div class="corner bl"><span></span></div>
  <div class="corner br"><span></span></div>

  <main class="hud" aria-live="polite">
    <section class="title-frame">
      <h1 class="title">G.Y.U.V.I.S. Standby</h1>
    </section>

    <section class="main" aria-label="GYUVIS standby clock">
      <div class="hex-field" aria-hidden="true">
        <div class="hex"></div>
        <div class="hex"></div>
        <div class="hex"></div>
        <div class="hex hex-icon">●</div>
        <div class="hex"></div>
        <div class="hex"></div>
        <div class="hex"></div>
        <div class="hex"></div>
        <div class="hex"></div>
      </div>

      <div class="time-panel">
        <div class="clock" id="clock">00:00</div>
        <div class="side">
          <div class="temperature" id="temperature">--°</div>
          <div class="weather-icon" aria-hidden="true"></div>
        </div>
      </div>

      <div class="date-row">
        <span id="weekday">MON</span>
        <span id="monthDay">JAN 01</span>
        <span id="ampm">AM</span>
      </div>
    </section>

    <section class="status">
      <div class="pulse-dot" aria-hidden="true"></div>
      <div class="status-main">Listening...</div>
      <div class="status-sub" id="statusSub">Awaiting your command, boss.</div>
    </section>
  </main>

  <script>
    const clockEl = document.getElementById("clock");
    const weekdayEl = document.getElementById("weekday");
    const monthDayEl = document.getElementById("monthDay");
    const ampmEl = document.getElementById("ampm");
    const temperatureEl = document.getElementById("temperature");
    const statusSubEl = document.getElementById("statusSub");

    const weekdays = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
    const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];

    function updateClock() {
      const now = new Date();
      let hour = now.getHours();
      const minute = String(now.getMinutes()).padStart(2, "0");
      const ampm = hour >= 12 ? "PM" : "AM";
      hour = hour % 12 || 12;

      clockEl.textContent = `${String(hour).padStart(2, "0")}:${minute}`;
      weekdayEl.textContent = weekdays[now.getDay()];
      monthDayEl.textContent = `${months[now.getMonth()]} ${String(now.getDate()).padStart(2, "0")}`;
      ampmEl.textContent = ampm;
    }

    async function loadWeather() {
      if (!navigator.geolocation) {
        temperatureEl.textContent = "64°";
        return;
      }

      navigator.geolocation.getCurrentPosition(async (position) => {
        try {
          const { latitude, longitude } = position.coords;
          const url = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m&timezone=auto`;
          const response = await fetch(url);
          if (!response.ok) throw new Error("weather failed");
          const data = await response.json();
          temperatureEl.textContent = `${Math.round(data.current.temperature_2m)}°`;
        } catch {
          temperatureEl.textContent = "64°";
        }
      }, () => {
        temperatureEl.textContent = "64°";
      }, {
        enableHighAccuracy: false,
        timeout: 1800,
        maximumAge: 600000
      });
    }

    function readQueryStatus() {
      const params = new URLSearchParams(location.search);
      const message = params.get("message");
      if (message) statusSubEl.textContent = message;
    }

    updateClock();
    loadWeather();
    readQueryStatus();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
