<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>GYUVIS Gesture HUD</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
</head>
<body>
  <canvas id="c"></canvas>

  <div id="topbar">
    <div id="status">카메라 준비 중...</div>
    <div id="hint">
      손을 왼쪽 공간으로 가져가면 그래프가 반응하고, 집으면 창을 끌 수 있어요.
    </div>
  </div>

  <video id="video" autoplay playsinline muted></video>

  <div id="voiceBox">
    <span id="voiceState">음성 OFF</span>
    <button id="voiceBtn">음성 켜기</button>
  </div>

  <script src="tts.js"></script>
  <script src="standby-ui.js"></script>
  <script src="browser-actions.js"></script>
  <script src="briefing.js"></script>
  <script src="wakeword.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
