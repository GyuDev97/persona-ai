<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 전자결재 자동입력</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f3f5;color:#222;font:14px 'Malgun Gothic',sans-serif}.top{height:64px;background:#151515;color:#fff;padding:21px 34px;font-weight:bold}.app{max-width:1480px;margin:24px auto;padding:0 18px;display:grid;grid-template-columns:280px 1fr;gap:20px}.side,.doc{background:#fff;border:1px solid #ddd}.side{padding:24px;height:max-content}.side p,.status{color:#666;line-height:1.6}.side label{display:block;font-weight:bold;margin:16px 0 7px}.side label input[type=radio]{width:auto;padding:0;margin-right:6px}select,input,textarea{width:100%;padding:10px;border:1px solid #ccc;font:inherit}textarea{height:180px;resize:vertical}.red{margin-top:14px;background:#df0000;color:#fff;border:0;border-radius:18px;padding:10px 18px;font-weight:bold;cursor:pointer}.red:disabled{background:#999;cursor:wait}.progress{display:none;margin-top:14px;padding:12px;background:#f5f9fd;border:1px solid #b9d9ec}.progress.show{display:block}.track{height:7px;background:#dce7ee;border-radius:8px;overflow:hidden;margin-top:8px}.bar{height:100%;width:35%;background:#129bda;animation:loading 1.15s ease-in-out infinite}@keyframes loading{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}.toolbar{padding:14px 20px;border-bottom:1px solid #ddd;font-size:16px;font-weight:bold}.paper{max-width:1120px;margin:auto;padding:34px 20px}.paper h2{text-align:center;font-size:28px;margin:0 0 30px}.common,.data{width:100%;border-collapse:collapse;margin-top:10px}.common th,.common td,.data th,.data td{border:1px solid #d4d4d4;padding:10px}.common th,.data th{background:#e8e8e8}.common th{width:15%}.common td{width:35%}.data td{height:48px}.data input,.common input,.common textarea{border:0;border-bottom:1px solid #777;background:transparent;padding:4px}.ai{background:#eaf8ff!important;box-shadow:inset 3px 0 #149bd7}.info{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.box{border:1px solid #ddd;padding:12px}.chip{display:inline-block;background:#eaf6ff;border-radius:12px;padding:4px 8px;margin:2px;font-size:12px}.score{color:#087bb8;font-weight:800}.warning{color:#b43d00;padding:3px}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:center;justify-content:center}.modal.open{display:flex}.modal-card{width:min(620px,calc(100vw - 32px));max-height:80vh;overflow:auto;background:#fff;padding:24px;box-shadow:0 20px 60px #0005}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head button{border:0;background:none;font-size:22px;cursor:pointer}@media(max-width:900px){.app{grid-template-columns:1fr}.paper{padding:20px 8px}}
</style></head><body>
<header class="top">전자결재 · AI 자동입력</header>
<div class="app"><aside class="side"><h2>전자결재 작성</h2><label><input type="radio" name="mode" value="direct" checked onchange="document.getElementById('documentArea').style.visibility='visible'"> 양식 직접 선택</label><label><input type="radio" name="mode" value="recommend" onchange="document.getElementById('documentArea').style.visibility='hidden'"> 첨부파일로 AI 양식 추천</label><p id="modeHelp">양식을 선택하면 빈 전자결재 문서가 먼저 열립니다.</p>
<select id="formSelect" aria-label="결재양식 선택"><option value="purchase">구매 신청서</option><option value="expense">지출결의서</option><option value="business_card">명함 신청서</option><option value="book_purchase">도서구입 신청서</option></select><label>첨부파일</label><input id="file" type="file" accept=".pdf,.xlsx,.xls,.txt,.csv,.png,.jpg,.jpeg,.webp,.docx,.hwpx"><label>또는 문서 내용</label><textarea id="text" placeholder="표의 열 제목과 행은 | 또는 탭으로 구분합니다."></textarea><button class="red" id="run">AI 자동입력</button>
<div id="progress" class="progress" aria-live="polite"><strong id="progressText">문서를 준비하고 있습니다.</strong><div class="track"><div class="bar"></div></div></div><div class="status" id="status">파일을 선택하면 자동 분석합니다.</div></aside>
<main class="doc" id="documentArea"><div class="toolbar">기안문 작성 — 자동입력 필드는 파란색으로 표시되며 직접 수정할 수 있습니다.</div><article class="paper"><h2 id="name"></h2><table class="common"><tr><th>문서번호</th><td>자동채번</td><th>기안일자</th><td>2026.09.22</td></tr><tr><th>기안자</th><td>사용자</td><th>기안부서</th><td>데모부서</td></tr><tr><th>참조자</th><td></td><th>보안등급</th><td>없음</td></tr><tr><th>* 문서제목</th><td colspan="3"><input id="title"></td></tr></table><div id="form"></div><div class="info"><section class="box"><b>추출 상태</b><div id="evidence">아직 분석 결과가 없습니다.</div></section><section class="box"><b>검증 경고</b><div id="warnings">현재 경고가 없습니다.</div></section></div></article></main></div>
<div class="modal" id="recommendModal" role="dialog" aria-modal="true" onclick="if(event.target.matches('[data-form]'))document.getElementById('documentArea').style.visibility='visible'"><section class="modal-card"><div class="modal-head"><h2>AI 추천 양식</h2><button id="closeRecommend" aria-label="닫기">×</button></div><p>추천을 확인한 뒤 사용할 양식을 선택하세요.</p><div id="recommendations"></div></section></div><script>
let formId='purchase',schema=null,currentData={fields:{},tables:{}},drafts={};const $=id=>document.getElementById(id);const formNames={purchase:'구매 신청서',expense:'지출결의서',business_card:'명함 신청서',book_purchase:'도서구입 신청서'};const moneyKeys=new Set(['unitPrice','amount','supplyAmount','tax','total']);
function localizeRecommendations(){document.querySelectorAll('#recommendations .box').forEach(card=>{let name=card.querySelector('b');if(!name)return;let id=name.textContent.trim();if(!formNames[id])return;name.textContent=formNames[id];let score=name.nextSibling;let percent=score?.textContent.match(/\d+/)?.[0];if(percent){let badge=document.createElement('span');badge.className='score';badge.textContent='적합도 '+percent+'%';score.replaceWith(document.createTextNode(' · '),badge)}})}
new MutationObserver(localizeRecommendations).observe($('recommendations'),{childList:true,subtree:true});
new MutationObserver(()=>{if(!$('recommendModal').classList.contains('open')&&$('documentArea').style.visibility==='visible'){document.querySelector('input[value="recommend"]').checked=true;$('formSelect').style.display='none';$('modeHelp').textContent='AI 추천 양식의 자동입력 결과를 검토·수정하세요.'}}).observe($('recommendModal'),{attributes:true,attributeFilter:['class']});
function localizeEvidence(){if(!schema)return;document.querySelectorAll('#evidence .chip').forEach(chip=>{let field=schema.fields.find(item=>chip.textContent.startsWith(item.id+' ·'));if(field)chip.textContent=chip.textContent.replace(field.id,field.label)})}
new MutationObserver(localizeEvidence).observe($('evidence'),{childList:true,subtree:true});
document.addEventListener('change',event=>{if(event.target.matches('input[name="mode"]'))$('documentArea').style.visibility=event.target.value==='recommend'?'hidden':'visible'});
document.addEventListener('blur',event=>{if(event.target.matches('[data-id]')&&moneyKeys.has(event.target.dataset.id)){let raw=event.target.value.replaceAll(',','');if(raw!==''&&!Number.isNaN(Number(raw)))event.target.value=Number(raw).toLocaleString('ko-KR')}},true);
document.addEventListener('click',event=>{if(event.target.matches('#recommendations [data-form]')){$('documentArea').style.display='block';$('documentArea').style.visibility='visible';setTimeout(()=>{document.querySelector('input[value="recommend"]').checked=true;$('formSelect').style.display='none';$('modeHelp').textContent='AI 추천 양식의 자동입력 결과를 검토·수정하세요.'},0)}});
function escapeHtml(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;')}
function input(id,v,type,ai){let display=moneyKeys.has(id)&&v!==null&&v!==undefined&&v!==''?Number(String(v).replaceAll(',','')).toLocaleString('ko-KR'):v;return `<input data-id="${id}" class="${ai?'ai':''}" type="${type==='date'?'date':'text'}" value="${escapeHtml(display)}">`}
function setLoading(show,message='문서를 분석하고 있습니다.'){ $('progress').classList.toggle('show',show);$('progressText').textContent=message;$('run').disabled=show;$('file').disabled=show;$('formSelect').disabled=show; }
function rememberInputs(){let fields={...(currentData.fields||{})},tables={...(currentData.tables||{})};schema.fields.forEach(field=>{let node=$('form').querySelector(`[data-id="${field.id}"]`);if(node)fields[field.id]={...(fields[field.id]||{}),value:node.value}});schema.tables.forEach((table,index)=>{let grid=[...$('form').querySelectorAll('.data')][index];tables[table.id]=grid?[...grid.querySelectorAll('tbody tr')].map(row=>Object.fromEntries(table.columns.map(column=>[column.id,row.querySelector(`[data-id="${column.id}"]`).value]))).filter(row=>Object.values(row).some(Boolean)):[]});currentData={...currentData,fields,tables};}
async function load(id){if(schema){rememberInputs();drafts[formId]=currentData}formId=id;schema=await fetch('/api/eapproval/forms/'+id).then(r=>r.json());$('name').textContent=schema.formName;$('title').value=schema.formName;$('formSelect').value=id;render(drafts[id]||{fields:{},tables:{}})}
function render(data){currentData=data;let f=data.fields||{},tables=data.tables||{},html='<table class="common">',pairs=[];schema.fields.forEach(x=>pairs.push(`<th>${x.label}</th><td>${x.type==='textarea'?`<textarea data-id="${x.id}" class="${f[x.id]?.value!=null?'ai':''}">${escapeHtml(f[x.id]?.value)}</textarea>`:input(x.id,f[x.id]?.value,x.type,f[x.id]?.value!=null)}</td>`));for(let i=0;i<pairs.length;i+=2)html+='<tr>'+pairs[i]+(pairs[i+1]||'<th></th><td></td>')+'</tr>';html+='</table>';schema.tables.forEach(t=>{let rows=tables[t.id]||[];html+=`<table class="data"><thead><tr>${t.columns.map(c=>'<th>'+c.label+'</th>').join('')}</tr></thead><tbody>`;for(let i=0;i<Math.max(5,rows.length);i++){let row=rows[i]||{};html+='<tr>'+t.columns.map(c=>'<td>'+input(c.id,row[c.id],c.type,row[c.id]!=null)+'</td>').join('')+'</tr>'}html+='</tbody></table>'});$('form').innerHTML=html;$('evidence').innerHTML=Object.entries(f).filter(([,x])=>x.value!=null).map(([id,x])=>`<span class="chip">${id} · ${Math.round((x.confidence||0)*100)}%</span>`).join('')||'찾은 정보가 없습니다.';$('warnings').innerHTML=(data.warnings||[]).map(x=>`<div class="warning">${escapeHtml(x)}</div>`).join('')||'현재 경고가 없습니다.'}
async function analyze(){setLoading(true,'첨부파일을 읽고 있습니다.');$('status').textContent='문서 유형을 확인하는 중입니다.';try{let response;if($('file').files[0]){let body=new FormData();body.append('file',$('file').files[0]);body.append('form_id',formId);setLoading(true,'문서를 추출하고 AI가 양식에 매핑하고 있습니다.');response=await fetch('/api/eapproval/upload',{method:'POST',body})}else{setLoading(true,'입력 텍스트를 AI가 양식에 매핑하고 있습니다.');response=await fetch('/api/eapproval/extract',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({form_id:formId,document_text:$('text').value})})}let data=await response.json();if(!response.ok)throw Error(data.detail||'분석에 실패했습니다.');render(data);$('status').textContent='자동입력이 완료되었습니다. 파란색 필드를 검토·수정하세요.'}catch(e){$('status').textContent=e.message||'분석 중 오류가 발생했습니다.'}finally{setLoading(false)}}
async function recommend(){if(!$('file').files[0]){ $('status').textContent='추천할 첨부파일을 선택해 주세요.';return }setLoading(true,'첨부파일을 분석하고 양식을 추천하고 있습니다.');try{let body=new FormData();body.append('file',$('file').files[0]);let response=await fetch('/api/eapproval/recommend',{method:'POST',body});let data=await response.json();if(!response.ok)throw Error(data.detail||'양식 추천에 실패했습니다.');$('recommendations').innerHTML=data.recommendations.map(item=>`<div class="box"><b>${item.formId}</b> · ${Math.round(item.confidence*100)}%<p>${escapeHtml(item.reason)}</p><button class="red" data-form="${item.formId}">이 양식 사용</button></div>`).join('');$('recommendModal').classList.add('open');$('recommendations').querySelectorAll('button').forEach(button=>button.onclick=async()=>{setLoading(true,'추천 문서를 현재 양식에 자동입력하고 있습니다.');try{let response=await fetch(`/api/eapproval/recommend/${data.analysisId}/apply/${button.dataset.form}`,{method:'POST'});let mapped=await response.json();if(!response.ok)throw Error(mapped.detail);await load(button.dataset.form);render(mapped);$('recommendModal').classList.remove('open');$('recommendations').innerHTML='';document.querySelector('input[value="direct"]').checked=true;$('formSelect').style.display='block';$('status').textContent='추천 양식에 자동입력을 완료했습니다.'}catch(error){$('status').textContent=error.message}finally{setLoading(false)}})}catch(error){$('status').textContent=error.message}finally{setLoading(false)}}
async function init(){try{let response=await fetch('/api/eapproval/forms');if(!response.ok)throw Error('양식 목록을 불러오지 못했습니다.');let forms=await response.json();$('formSelect').innerHTML=forms.map(x=>`<option value="${x.formId}">${x.formName}</option>`).join('')}catch(error){$('status').textContent='양식 목록 서버 연결에 실패했습니다. 기본 양식 목록을 표시합니다.'}finally{$('formSelect').onchange=e=>load(e.target.value);$('run').onclick=()=>document.querySelector('input[name="mode"]:checked').value==='recommend'?recommend():analyze();$('file').onchange=()=>{$('file').files[0]&&($('run').onclick())};document.querySelectorAll('input[name="mode"]').forEach(radio=>radio.onchange=()=>{$('modeHelp').textContent=radio.value==='recommend'?'파일을 분석해 AI 추천 양식을 보여줍니다. 최종 선택은 사용자가 합니다.':'양식을 선택하면 빈 전자결재 문서가 먼저 열립니다.';$('formSelect').style.display=radio.value==='recommend'?'none':'block'});$('closeRecommend').onclick=()=>$('recommendModal').classList.remove('open');$('recommendModal').onclick=e=>{if(e.target===$('recommendModal'))$('recommendModal').classList.remove('open')};try{await load($('formSelect').value)}catch(error){$('status').textContent='서버를 재시작한 뒤 새로고침해 주세요.'}}}init();
</script></body></html>
