[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gyunexus"
version = "0.1.0"
description = "GyuNexus: GYUVIS personal assistant + multi-agent workspace"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.4",
    "openai>=1.50",
    "httpx>=0.27",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
mariadb = ["pymysql"]

[tool.setuptools.packages.find]
include = ["gyunexus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
